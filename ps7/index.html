      h1: "Keep the rows where neither variable is missing, then use the usual summary functions. For the lowest value, sort the data or use which.min().",
      h2: "<code>subset(wdi, !is.na(lifeexp) &amp; !is.na(gdppc))</code>; <code>nrow()</code>; <code>summary()</code>, <code>sd()</code>; <code>plot(lifeexp ~ gdppc, data = d)</code>; <code>d[which.min(d$lifeexp), ]</code>.",
      h3: `nrow(wdi)                                      # 217 economies
d <- subset(wdi, !is.na(lifeexp) & !is.na(gdppc))
nrow(d)                                        # 199 with both variables
wdi$country[is.na(wdi$gdppc)]                  # the 18 without GDP per head

summary(d[, c("lifeexp", "gdppc")])
sd(d$lifeexp); sd(d$gdppc)

plot(lifeexp ~ gdppc, data = d, pch = 19, col = "#2A5A88",
     xlab = "GDP per head ($, PPP)", ylab = "Life expectancy (years)")

head(d[order(d$lifeexp), c("country", "lifeexp", "gdppc")], 4)`,
      h3note: "199 of the 217 economies have both variables. Life expectancy: mean 72.7, median 73.8, SD 8.0 years. GDP per head: mean $26,353, median $16,761, SD $26,295. The lowest life expectancy is the Central African Republic, 31.5 years; next come Chad (53.0) and Nigeria (53.0).",
      code: "# Keep countries with both variables, then describe them\n" },

    { type: "solution", label: "1(a)", title: "Who is in the data?",
      question: "How many countries have data on both life expectancy and GDP per head? Which kinds of countries are missing?",
      steps: [
        { k: "Count", b: "<p>217 economies; 199 have both life expectancy and GDP per head.</p>" },
        { k: "Who is missing", b: "<p>The 18 without GDP per head are mostly small territories (Gibraltar, Guam, the Isle of Man, Monaco and others) and countries in conflict or cut off from international statistics (Eritrea, North Korea, South Sudan, Venezuela, Yemen, Cuba).</p>" },
        { k: "Why it matters", b: "<span class='answer-line'>They are not missing at random: our results describe countries with working statistical systems.</span>" },
      ] },

    { type: "solution", label: "1(b)", title: "Describe the relationship",
      question: "Report the mean, median and standard deviation of both variables, and draw a scatter plot of life expectancy against GDP per head. Describe the relationship in two sentences.",
      steps: [
        { k: "The numbers", b: "<table class='ptab'><tr><th></th><th>Mean</th><th>Median</th><th>SD</th></tr><tr><td>Life expectancy (years)</td><td>72.7</td><td>73.8</td><td>8.0</td></tr><tr><td>GDP per head ($, PPP)</td><td>26,353</td><td>16,761</td><td>26,295</td></tr></table>" },
        { k: "The shape", b: "<span class='answer-line'>Life expectancy rises steeply with income among poor countries and flattens out among rich ones: strongly positive, but curved.</span>" },
        { k: "The skew", b: "<p>GDP per head is very right-skewed: the mean is far above the median, pulled up by a few very rich countries (Luxembourg, Macao, Singapore, Qatar).</p>" },
      ] },

    { type: "solution", label: "1(c)", title: "An outlier",
      question: "Which country has the lowest life expectancy? Is the value plausible? Look it up on the World Bank website and say what you would do with it.",
      steps: [
        { k: "The value", b: "<p>The Central African Republic: 31.5 years, more than 20 years below the next lowest (Chad, 53.0; Nigeria, 53.0).</p>" },
        { k: "Is it plausible?", b: "<p>It is far below every other poor country, and below the country's own figures for earlier years. The World Bank takes life expectancy from the UN population estimates: check it at the source before relying on it.</p>" },
        { k: "What to do", b: "<span class='answer-line'>Keep it, but report how much the results depend on it. Question 4(c) does this.</span>" },
      ] },

    // ================================================================== Question 2
    { type: "section", eyebrow: "Question 2", title: "A First Regression",
      text: "<p>Regress life expectancy on GDP per head, measured in thousands of dollars.</p>" },

    { type: "r", title: "2. Life expectancy on GDP per head, in levels", plot: { width: 680, height: 420 },
      desc: "Fit <code>lm(lifeexp ~ I(gdppc / 1000), data = d)</code>, read the slope and R², and plot the residuals against the fitted values.",
      h1: "I(gdppc / 1000) measures income in thousands of dollars, so the slope is the change in life expectancy per $1,000.",
      h2: "<code>summary(m1)</code> for the coefficients and R²; <code>plot(m1, which = 1)</code> for the residual plot.",
      h3: `m1 <- lm(lifeexp ~ I(gdppc / 1000), data = d)
summary(m1)
plot(m1, which = 1)                            # residuals against fitted values`,
      h3note: "ŷ = 67.03 + 0.216 × GDP per head ($ thousands); R² = 0.506. The residual plot shows a clear curve: large negative residuals for the poorest countries, positive ones in the middle.",
      code: "# Regress life expectancy on GDP per head ($ thousands)\n" },

    { type: "solution", label: "2(a)", title: "Read the slope and R²",
      question: "Interpret the slope and R².",
      steps: [
        { k: "The fitted line", b: String.raw`\[ \widehat{\text{lifeexp}} = 67.0 + 0.216 \times \frac{\text{GDP per head}}{1{,}000} \]` },
        { k: "The slope", b: "<span class='answer-line'>Across countries, $1,000 more GDP per head is associated with life expectancy 0.22 years (about 2.6 months) higher, on average.</span>" },
        { k: "R²", b: String.raw`<p>\(R^2 = 0.506\): income accounts for about half of the variation in life expectancy across countries.</p>` },
      ] },

    { type: "solution", label: "2(b)", title: "What the residual plot shows",
      question: "Plot the residuals against the fitted values. Which OLS assumption looks doubtful, and why?",
      steps: [
        { k: "What we see", b: "<p>The residuals form a curve: strongly negative for the poorest countries, positive in the middle, and back near zero for the richest. The straight line overpredicts life expectancy in the poorest countries and underpredicts it for middle-income ones.</p>" },
        { k: "The assumption", b: String.raw`<span class="answer-line">Assumption 1, linear in parameters: \(Y = \beta_0 + \beta_1 X + u\) is not the right model when X is GDP per head in dollars. The true relationship is curved.</span>` },
      ] },

    // ================================================================== Question 3
    { type: "section", eyebrow: "Question 3", title: "Logs",
      text: String.raw`<p>Replace GDP per head by its natural log. In \(Y = b_0 + b_1 \log(X)\), a 1% rise in X goes with a change in Y of about \(b_1 / 100\).</p>` },

    { type: "r", title: "3. Life expectancy on log GDP per head", plot: { width: 680, height: 420 },
      desc: "Create <code>lgdp &lt;- log(gdppc)</code>, fit <code>lm(lifeexp ~ lgdp, data = d)</code>, and compare R² and the residual plot with Question 2.",
      h1: "log() is the natural log. Add the new variable to d so later steps can use it.",
      h2: "<code>d$lgdp &lt;- log(d$gdppc)</code>; <code>summary(m2)</code>; <code>plot(m2, which = 1)</code>; for a doubling, <code>coef(m2)[2] * log(2)</code>.",
      h3: `d$lgdp <- log(d$gdppc)
m2 <- lm(lifeexp ~ lgdp, data = d)
summary(m2)
coef(m2)["lgdp"] * log(2)                      # twice as rich
plot(m2, which = 1)

plot(lifeexp ~ lgdp, data = d, pch = 19, col = "#2A5A88",
     xlab = "log GDP per head", ylab = "Life expectancy (years)")
abline(m2, col = "#E36533", lwd = 2)`,
      h3note: "ŷ = 15.73 + 5.916 × log(GDP per head); R² = 0.715. Twice as rich: 5.916 × log 2 = 4.1 years. The curve in the residuals has gone; the spread is larger among the poorer countries.",
      code: "# Use the log of GDP per head\n" },

    { type: "solution", label: "3(a)", title: "Read the slope in logs",
      question: "Interpret the slope. By how many years does life expectancy differ between two countries, one twice as rich as the other?",
      steps: [
        { k: "The fitted line", b: String.raw`\[ \widehat{\text{lifeexp}} = 15.7 + 5.92 \times \log(\text{GDP per head}) \]` },
        { k: "A 1% difference", b: String.raw`\[ \frac{b_1}{100} = \frac{5.92}{100} = 0.059 \text{ years} \]<p>A country with 1% higher GDP per head has life expectancy about 0.06 years higher, on average.</p>` },
        { k: "Twice as rich", b: String.raw`<p>Twice as rich means \(\log(2X) - \log(X) = \log 2 = 0.693\) higher:</p>\[ b_1 \times \log 2 = 5.92 \times 0.693 = 4.1 \text{ years} \]<span class="answer-line">A country twice as rich as another has a life expectancy about 4 years higher, on average.</span>` },
      ] },

    { type: "solution", label: "3(b)", title: "Which model?",
      question: "Compare R² and the residual plot with Question 2. Which model would you use, and why?",
      steps: [
        { k: "Compare", b: String.raw`<p>\(R^2\) rises from 0.506 to 0.715, and the curve in the residuals disappears.</p>` },
        { k: "Choose", b: "<span class='answer-line'>The log model: each doubling of income goes with a similar gain in years, whether a country is poor or rich.</span><p>In levels, the same $1,000 would mean a lot to a poor country and almost nothing to a rich one.</p>" },
      ] },

    // ================================================================== Question 4
    { type: "section", eyebrow: "Question 4", title: "Inference and Heteroskedasticity",
      text: "<p>Use the log model of Question 3. In RStudio, <code>library(AER)</code> loads the two packages for robust standard errors; on this page they are <code>lmtest</code> and <code>sandwich</code>.</p>" },

    { type: "r", title: "4(a) and (b). Test, interval and robust standard errors",
      desc: "Test H₀: β₁ = 0 and give a 95% confidence interval for the slope. Then compute robust standard errors and compare.",
      h1: "summary() gives the t statistic; confint() the interval. Robust standard errors keep the same coefficients and change only the standard errors.",
      h2: "<code>confint(m2)</code>; <code>coeftest(m2, vcov = vcovHC(m2))</code>; <code>coefci(m2, vcov = vcovHC(m2))</code> for the robust interval.",
      h3: `summary(m2)$coefficients                      # estimate, SE, t, p
confint(m2)                                    # 95% interval

library(lmtest); library(sandwich)             # in RStudio: library(AER)
coeftest(m2, vcov = vcovHC(m2))                # robust standard errors
coefci(m2, vcov = vcovHC(m2))                  # robust 95% interval`,
      h3note: "Slope 5.916, SE 0.266, t = 22.2, p &lt; 0.001; 95% interval 5.39 to 6.44. Robust SE 0.347, robust interval 5.23 to 6.60.",
      code: "# Test the slope, then robust standard errors\n" },

    { type: "solution", label: "4(a)", title: "Test the slope",
      question: String.raw`Test \(H_0: \beta_1 = 0\) in the model of Question 3, and give a 95% confidence interval for the slope.`,
      steps: [
        { k: "Hypotheses", b: String.raw`<p>\(H_0: \beta_1 = 0\) (no relationship between log income and life expectancy) against \(H_1: \beta_1 \neq 0\); \(\alpha = 0.05\).</p>` },
        { k: "Test statistic", b: String.raw`\[ t = \frac{b_1 - 0}{\text{SE}(b_1)} = \frac{5.916}{0.266} = 22.2 \]` },
        { k: "Decision", b: String.raw`<p>With 197 degrees of freedom the 5% critical value is 1.97; 22.2 is far beyond it (\(p < 0.001\)).</p><span class="answer-line">Reject H₀: life expectancy is clearly related to log income.</span>` },
        { k: "95% interval", b: String.raw`\[ b_1 \pm 1.97 \times \text{SE}(b_1) = 5.92 \pm 1.97 \times 0.266 = 5.39 \text{ to } 6.44 \]` },
      ] },

    { type: "solution", label: "4(b)", title: "Robust standard errors",
      question: "Compute robust standard errors. How do they compare with the usual ones? Does your conclusion change?",
      steps: [
        { k: "The numbers", b: "<p>Robust SE 0.347 against the usual 0.266: about 30% larger. Robust 95% interval: 5.23 to 6.60.</p>" },
        { k: "Why", b: String.raw`<p>The residual plot shows more spread among poor countries than among rich ones: heteroskedasticity, so assumption 5, \(\text{Var}(u \mid X) = \sigma^2\), fails and the usual standard error is too small.</p>` },
        { k: "Conclusion", b: String.raw`\[ t = \frac{5.92}{0.347} = 17.0 \]<span class="answer-line">The conclusion does not change: the slope is still far from zero.</span>` },
      ] },

    { type: "r", title: "4(c). Without the Central African Republic",
      desc: "Refit the log model without the country from Question 1(c). Compare the slope and both standard errors.",
      h1: "Drop one row with subset(), refit, and compute both standard errors again.",
      h2: "<code>subset(d, country != \"Central African Republic\")</code>.",
      h3: `m2b <- lm(lifeexp ~ lgdp, data = subset(d, country != "Central African Republic"))
summary(m2b)$coefficients
summary(m2b)$r.squared
coeftest(m2b, vcov = vcovHC(m2b))`,
      h3note: "Without the Central African Republic: slope 5.648, SE 0.243, robust SE 0.222; R² = 0.734.",
      code: "# Refit without the Central African Republic\n" },

    { type: "solution", label: "4(c)", title: "One country matters",
      question: "Refit the model without the country from Question 1(c). What happens to the slope and to the two standard errors? What does this tell you?",
      steps: [
        { k: "Compare", b: "<table class='ptab'><tr><th></th><th>All 199</th><th>Without CAR</th></tr><tr><td>Slope</td><td>5.92</td><td>5.65</td></tr><tr><td>Usual SE</td><td>0.266</td><td>0.243</td></tr><tr><td>Robust SE</td><td>0.347</td><td>0.222</td></tr><tr><td>R²</td><td>0.715</td><td>0.734</td></tr></table>" },
        { k: "What changed", b: "<p>The slope falls by 5%, and the gap between the usual and the robust standard errors almost disappears: most of it came from this single country.</p>" },
        { k: "Lesson", b: "<span class='answer-line'>One extreme point among 199 changes our view of the slope and of the spread of the errors. Always check outliers, and report results with and without them.</span>" },
      ] },

    // ================================================================== Question 5
    { type: "section", eyebrow: "Question 5", title: "A Dummy Variable and Omitted Variable Bias",
      text: "<p>Create a dummy <code>ssa</code> equal to 1 for countries in Sub-Saharan Africa and 0 otherwise, and add it to the log model.</p>" },

    { type: "r", title: "5. Add the Sub-Saharan Africa dummy", plot: { width: 680, height: 420 },
      desc: "Fit <code>lm(lifeexp ~ lgdp + ssa, data = d)</code>, compare the coefficient on <code>lgdp</code> with Question 3, and compute <code>cor(d$lgdp, d$ssa)</code>.",
      h1: "A dummy is a 0/1 variable. as.numeric() turns TRUE/FALSE into 1/0.",
      h2: "<code>d$ssa &lt;- as.numeric(d$region == \"Sub-Saharan Africa\")</code>; <code>summary(m3)</code>; <code>cor()</code>.",
      h3: `d$ssa <- as.numeric(d$region == "Sub-Saharan Africa")
sum(d$ssa)                                     # 46 countries
m3 <- lm(lifeexp ~ lgdp + ssa, data = d)
summary(m3)
coeftest(m3, vcov = vcovHC(m3))
cor(d$lgdp, d$ssa)

plot(lifeexp ~ lgdp, data = d, pch = 19, col = ifelse(d$ssa == 1, "#E36533", "#2A5A88"),
     xlab = "log GDP per head", ylab = "Life expectancy (years)")
abline(coef(m3)[1], coef(m3)[2], col = "#2A5A88", lwd = 2)
abline(coef(m3)[1] + coef(m3)[3], coef(m3)[2], col = "#E36533", lwd = 2)`,
      h3note: "ŷ = 28.83 + 4.686 × lgdp − 5.407 × ssa; SE of ssa 0.83 (robust 0.90); R² = 0.766. The correlation between lgdp and ssa is −0.62. The plot shows two parallel lines, 5.4 years apart.",
      code: "# Add a dummy for Sub-Saharan Africa\n" },

    { type: "solution", label: "5(a)", title: "Read the dummy",
      question: "Interpret the coefficient on ssa.",
      steps: [
        { k: "The fitted line", b: String.raw`\[ \widehat{\text{lifeexp}} = 28.8 + 4.69 \times \text{lgdp} - 5.41 \times \text{ssa} \]` },
        { k: "Two parallel lines", b: String.raw`<p>Outside Sub-Saharan Africa (ssa = 0): \(28.8 + 4.69 \times \text{lgdp}\). Inside (ssa = 1): \(23.4 + 4.69 \times \text{lgdp}\). Same slope, intercepts 5.4 apart.</p>` },
        { k: "Interpret", b: "<span class='answer-line'>Comparing countries with the same GDP per head, life expectancy in Sub-Saharan Africa is 5.4 years lower, on average (SE 0.83; robust SE 0.90).</span>" },
      ] },

    { type: "solution", label: "5(b)", title: "Omitted variable bias",
      question: "How does the coefficient on lgdp change? Explain the direction of the change, using the two conditions for omitted variable bias.",
      steps: [
        { k: "The change", b: "<p>The coefficient on log GDP per head falls from 5.92 (Question 3) to 4.69.</p>" },
        { k: "Condition 1: does it affect Y?", b: "<p>Yes. At the same income, being in Sub-Saharan Africa goes with lower life expectancy (sign −), for example through the disease burden, including HIV and malaria.</p>" },
        { k: "Condition 2: is it correlated with X?", b: String.raw`<p>Yes: \(r(\text{lgdp}, \text{ssa}) = -0.62\) (sign −). Countries in the region are poorer.</p>` },
        { k: "The direction", b: String.raw`\[ (-) \times (-) = (+) \]<span class="answer-line">Leaving out ssa biased the income coefficient upwards: part of the region's lower life expectancy was attributed to its lower income.</span>` },
      ] },

    // ================================================================== Question 6
    { type: "section", eyebrow: "Question 6", title: "An Interaction",
      text: "<p>Let the slope on log income differ inside and outside Sub-Saharan Africa.</p>" },

    { type: "r", title: "6. Different slopes?",
      desc: "Fit <code>lm(lifeexp ~ lgdp * ssa, data = d)</code>. What is the slope on lgdp inside and outside Sub-Saharan Africa?",
      h1: "lgdp * ssa adds lgdp, ssa and their product lgdp:ssa. The product's coefficient is the difference between the two slopes.",
      h2: "<code>summary(m4)</code>; the slope inside the region is <code>coef(m4)[\"lgdp\"] + coef(m4)[\"lgdp:ssa\"]</code>.",
      h3: `m4 <- lm(lifeexp ~ lgdp * ssa, data = d)
summary(m4)
coef(m4)["lgdp"] + coef(m4)["lgdp:ssa"]        # slope inside Sub-Saharan Africa
coeftest(m4, vcov = vcovHC(m4))`,
      h3note: "Slope outside: 4.920. Interaction −1.131 (SE 0.755, p = 0.14; robust p = 0.41). Slope inside: 4.920 − 1.131 = 3.79.",
      code: "# Let the slope differ by region\n" },

    { type: "solution", label: "6", title: "Can the data tell the slopes apart?",
      question: "What is the slope on lgdp inside and outside Sub-Saharan Africa? Can the data tell the two slopes apart?",
      steps: [
        { k: "The two slopes", b: "<p>Outside Sub-Saharan Africa: 4.92. Inside: 4.92 + (−1.13) = 3.79.</p>" },
        { k: "Test the difference", b: String.raw`\[ t = \frac{-1.13}{0.755} = -1.5, \qquad p = 0.14 \quad (\text{robust } p = 0.41) \]` },
        { k: "Conclude", b: "<span class='answer-line'>We cannot reject equal slopes: the data are consistent with the same income gradient in both groups, with a lower intercept in Sub-Saharan Africa (Question 5).</span>" },
      ] },

    // ================================================================== Question 7
    { type: "section", eyebrow: "Question 7", title: "Health Spending",
      text: "<p>Add the log of health spending per head to the model of Question 5, using the countries with data on all three variables.</p>" },

    { type: "r", title: "7. Add health spending",
      desc: "Fit the model of Question 5 on the countries with health data, then add <code>lhealth</code>. Compare the coefficient on lgdp and its standard error, and compute the correlation between lgdp and lhealth.",
      h1: "Compare the two models on the same countries, so that only the added variable differs.",
      h2: "<code>h &lt;- subset(d, !is.na(health))</code>; <code>h$lhealth &lt;- log(h$health)</code>; <code>cor(h$lgdp, h$lhealth)</code>.",
      h3: `h <- subset(d, !is.na(health)); h$lhealth <- log(h$health)
nrow(h)                                        # 186 countries
summary(lm(lifeexp ~ lgdp + ssa, data = h))$coefficients
m5 <- lm(lifeexp ~ lgdp + ssa + lhealth, data = h)
summary(m5)$coefficients
coeftest(m5, vcov = vcovHC(m5))
cor(h$lgdp, h$lhealth)`,
      h3note: "On the same 186 countries: lgdp 4.788 (SE 0.322) without health spending, 3.437 (SE 0.753) with it. lhealth: 1.261 (SE 0.636, p = 0.049; robust p = 0.14). R² 0.766 → 0.771. Correlation 0.94.",
      code: "# Add log health spending per head\n" },

    { type: "solution", label: "7(a)", title: "What happens to the income coefficient?",
      question: "What happens to the coefficient on lgdp and to its standard error?",
      steps: [
        { k: "The numbers", b: "<table class='ptab'><tr><th></th><th>Without lhealth</th><th>With lhealth</th></tr><tr><td>lgdp</td><td>4.79</td><td>3.44</td></tr><tr><td>SE</td><td>0.32</td><td>0.75</td></tr><tr><td>R²</td><td>0.766</td><td>0.771</td></tr></table>" },
        { k: "Read it", b: "<span class='answer-line'>The income coefficient falls and its standard error more than doubles, while R² barely moves.</span><p>lhealth: 1.26 (SE 0.64, p = 0.049; robust p = 0.14).</p>" },
      ] },

    { type: "solution", label: "7(b)", title: "Multicollinearity",
      question: "Compute the correlation between log GDP per head and log health spending. Use it to explain (a).",
      steps: [
        { k: "The correlation", b: String.raw`<p>\(r(\text{lgdp}, \text{lhealth}) = 0.94\): richer countries spend more on health.</p>` },
        { k: "Why the SE grows", b: "<p>The two variables carry almost the same information, so the regression cannot separate their effects well: multicollinearity.</p>" },
        { k: "Is an assumption broken?", b: "<span class='answer-line'>No: only perfect multicollinearity violates the OLS assumptions. The estimates are still unbiased, but imprecise.</span><p>The fall in the income coefficient also suggests that part of the association between income and life expectancy runs through health spending.</p>" },
      ] },

    // ================================================================== Question 8
    { type: "section", eyebrow: "Question 8", title: "Write It Up",
      text: "<p>Report the main result in words, with its uncertainty, and say what the regression can and cannot show.</p>" },

    { type: "solution", label: "8(a)", title: "Two sentences",
      question: "Report the main result of Question 5 in two sentences, with its 95% confidence interval and the data you used.",
      steps: [
        { k: "The numbers", b: String.raw`<p>Twice as rich: \(4.69 \times \log 2 = 3.25\) years. Robust 95% interval for the slope, 4.02 to 5.35, times \(\log 2\): 2.8 to 3.7 years. Dummy: −5.4 years, robust interval −7.2 to −3.6.</p>` },
        { k: "Write", b: "<span class='answer-line'>“Across 199 countries in 2019 (World Bank, World Development Indicators), comparing countries inside or outside Sub-Saharan Africa, a country twice as rich as another has a life expectancy about 3.2 years higher on average (95% CI 2.8 to 3.7 years, robust standard errors). At the same income, life expectancy in Sub-Saharan Africa is 5.4 years lower (95% CI 3.6 to 7.2 years).”</span>" },
      ] },

    { type: "solution", label: "8(b)", title: "Does income cause longer lives?",
      question: "Can we conclude that higher income <i>causes</i> longer lives? Give two reasons why not.",
      steps: [
        { k: "Reverse causality", b: "<p>Healthier people work and learn more, so longer lives can raise income.</p>" },
        { k: "Omitted variables", b: "<p>Institutions, education, sanitation and the disease environment affect both income and health; the regression controls only for one region.</p>" },
        { k: "The data", b: "<p>A cross-section of countries, not a random sample, and the worst-measured countries are missing.</p>" },
        { k: "Conclude", b: "<span class='answer-line'>The regression describes an association. A causal claim needs a theory of the mechanism and a design that rules out these alternatives.</span>" },
      ] },
  ],
};
