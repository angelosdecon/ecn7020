      h3: "lo <- tapply(gdp$GDP_per_capita_PPS, gdp$Country, min)\nhi <- tapply(gdp$GDP_per_capita_PPS, gdp$Country, max)\nrbind(lowest = lo, highest = hi)\nround(hi / lo, 2)",
      h3note: "France 9,500 to 51,700 (ratio 5.44); Germany 24,200 to 58,600 (2.42); UK 19,000 to 184,000 (9.68).",
      code: "# Lowest, highest and ratio by country\n" },

    { type: "r", title: "(e) Median regional GDP per capita",
      desc: "Find the median regional GDP per capita for each country, and compare it with the mean.",
      h1: "The median is not affected by a few extreme regions, so a large gap between mean and median is a warning sign.",
      h2: "<code>tapply(..., median)</code>. Print it next to the means from step (b) with <code>rbind(mean = m, median = med)</code>.",
      h3: "med <- tapply(gdp$GDP_per_capita_PPS, gdp$Country, median)\nround(rbind(mean = m, median = med))",
      h3note: "Medians: France 24,700, Germany 34,400, UK 26,700. In France and Germany the mean and median are close. In the UK the mean (about 31,800) is well above the median, which again points to extreme values at the top.",
      code: "# Median by country\n" },

    { type: "r", title: "(f)(i) Identify the outliers", plot: { width: 680, height: 440 },
      desc: "There are some outliers in the data. Identify them: draw a box plot by country, then list the regions with the highest and lowest values.",
      h1: "A box plot marks as outliers the points more than 1.5 interquartile ranges beyond the box. Then find out which regions those points are.",
      h2: "<code>boxplot(GDP_per_capita_PPS ~ Country, data = gdp)</code> draws one box per country. <code>order()</code> sorts a data frame: <code>gdp[order(gdp$GDP_per_capita_PPS), ]</code>; <code>head()</code> and <code>tail()</code> show the ends.",
      h3: "boxplot(GDP_per_capita_PPS ~ Country, data = gdp, col = \"#E1EBF5\",\n        main = \"Regional GDP per capita, 2016\", ylab = \"PPS\")\nsorted <- gdp[order(gdp$GDP_per_capita_PPS), ]\nhead(sorted, 5)\ntail(sorted, 5)",
      h3note: "Two regions stand far apart: <b>Inner London - West</b> (184,000, more than three times any other region) and <b>Mayotte</b> (9,500, a French overseas department). The box plot also flags milder cases such as Hamburg, Île de France, Inner London - East and Guyane. Which ones to treat as outliers is a judgement; the next step removes the two extreme ones.",
      code: "# Box plot and the extreme regions\n" },

    { type: "r", title: "(f)(ii) Remove the outliers and recalculate",
      desc: "Remove Inner London - West and Mayotte. What happens to the coefficient of variation, and to the ratio of the highest to the lowest regional income?",
      h1: "Make a new data frame without the two regions, then repeat steps (b) and (d) on it. Keep the original <code>gdp</code> so you can compare.",
      h2: "<code>subset(gdp, !(Region %in% c(\"...\", \"...\")))</code> keeps the rows whose region is not in the list. Region names must be typed exactly as they appear in the data.",
      h3: "gdp2 <- subset(gdp, !(Region %in% c(\"Inner London - West\", \"Mayotte\")))\n\ncv2 <- tapply(gdp2$GDP_per_capita_PPS, gdp2$Country, sd) /\n       tapply(gdp2$GDP_per_capita_PPS, gdp2$Country, mean)\nratio2 <- tapply(gdp2$GDP_per_capita_PPS, gdp2$Country, max) /\n          tapply(gdp2$GDP_per_capita_PPS, gdp2$Country, min)\n\nround(rbind(cv_before = cv, cv_after = cv2,\n            ratio_before = hi / lo, ratio_after = ratio2), 3)",
      h3note: "UK: CV falls from 0.795 to 0.239 and the ratio from 9.68 to 2.64. France: CV from 0.270 to 0.239 and the ratio from 5.44 to 3.29. Germany is unchanged, because neither region is German.",
      code: "# Remove the two outliers and recalculate\n" },

    { type: "write", title: "(f)(iii) Interpret your new results",
      desc: "Interpret the results after removing the outliers. What do they tell you about regional inequality in the three countries, and about the coefficient of variation as a measure?",
      h1: "Compare the 'before' and 'after' rows. Which country's story changed, and how much of it rested on a single region?",
      h2: "<ul><li>Why might Inner London - West have such a high GDP <b>per resident</b>? Think about where people work and where they live.</li><li>Which of the measures you used changed least when the outliers were removed?</li><li>Is removing an outlier always the right thing to do?</li></ul>",
      h3: "<p>Without the two extreme regions the three countries look alike: CVs of about 0.22 to 0.24 and richest-to-poorest ratios of about 2.4 to 3.3. The UK's apparently huge regional dispersion came almost entirely from one region.</p><p>Inner London - West is partly a measurement issue: GDP is produced by the many people who commute in to work there, but it is divided by the small number who live there, so GDP per resident is inflated. This is the Week 1 question 'what does it actually measure?'</p><p>The lesson for the method: the CV and the highest-to-lowest ratio are very sensitive to outliers, because one depends on squared deviations and the other on just two regions. The median barely moves. So look at the data, report results with and without outliers, and say which you removed and why. Removing them is not automatically right: London's concentration of activity and the low incomes in French overseas departments are real features of those economies.</p>" },
  ],
};
