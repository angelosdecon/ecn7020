// One random draw for each simulation.
function drawFails() {            // Question 1: number of failures among 12 firms, each fails with probability 0.2
  let x = 0;
  for (let i = 0; i < 12; i++) if (Math.random() < 0.2) x += 1;
  return x;
}
function drawNormal(mu, sd) {     // Box–Muller: one draw from N(mu, sd^2)
  const u = 1 - Math.random(), v = Math.random();
  return mu + sd * Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
}
function drawSpend() { return drawNormal(150, 30); }   // Question 2: X ~ N(150, 30^2), £ a month
function drawRentMean() {         // Question 4: mean rent of 36 flats; rents with mean £1,200, SD £300 (drawn from a normal)
  let s = 0;
  for (let i = 0; i < 36; i++) s += drawNormal(1200, 300);
  return s / 36;
}


// Small sketch of a normal curve with the area we want shaded (inline SVG).
// o: { mu, sd, a, b: limits of the shaded area (null = minus/plus infinity), ticks: [x values],
//      zLabels: true, area: text shown in the shaded area, cut: text above a cut-off, unit, title, w, h }
function ncurve(o) {
  const W = o.w || 520, H = o.h || 190, L = 14, R = 14, T = o.title ? 26 : 10, B = o.zLabels === false ? 30 : 46;
  const mu = o.mu, sd = o.sd, lo = mu - 3.6 * sd, hi = mu + 3.6 * sd;
  const X = (x) => L + (x - lo) / (hi - lo) * (W - L - R);
  const pdf = (x) => Math.exp(-0.5 * ((x - mu) / sd) ** 2);
  const Y = (v) => T + (1 - v) * (H - T - B) ;
  const base = Y(0);
  let curve = "", n = 160;
  for (let i = 0; i <= n; i++) { const x = lo + (hi - lo) * i / n; curve += (i ? "L" : "M") + X(x).toFixed(1) + " " + Y(pdf(x)).toFixed(1); }
  const a = o.a === null || o.a === undefined ? lo : o.a, b = o.b === null || o.b === undefined ? hi : o.b;
  let area = "M" + X(a).toFixed(1) + " " + base;
  for (let i = 0; i <= n; i++) { const x = a + (b - a) * i / n; area += "L" + X(x).toFixed(1) + " " + Y(pdf(x)).toFixed(1); }
  area += "L" + X(b).toFixed(1) + " " + base + "Z";
  const u = o.unit || "";
  let g = '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="' + (o.alt || "Normal curve with the area we want shaded") +
    '" style="width:100%;max-width:' + W + 'px;display:block;margin:10px 0;background:#FFFFFF;border-radius:8px">';
  if (o.title) g += '<text x="' + (W / 2) + '" y="17" text-anchor="middle" font-family="Arial" font-size="13" font-weight="bold" fill="#1A1A1A">' + o.title + '</text>';
  g += '<path d="' + area + '" fill="#E36533" fill-opacity="0.55"/>';
  g += '<path d="' + curve + '" fill="none" stroke="#2A5A88" stroke-width="2.2"/>';
  g += '<line x1="' + L + '" y1="' + base + '" x2="' + (W - R) + '" y2="' + base + '" stroke="#1A1A1A" stroke-width="1"/>';
  (o.ticks || []).forEach((x) => {
    const z = (x - mu) / sd, zt = Math.abs(z - Math.round(z)) < 1e-9 ? String(Math.round(z)).replace("-", "−") : z.toFixed(2).replace(/0$/, "").replace("-", "−");
    g += '<line x1="' + X(x) + '" y1="' + base + '" x2="' + X(x) + '" y2="' + (base + 5) + '" stroke="#1A1A1A"/>';
    g += '<text x="' + X(x) + '" y="' + (base + 18) + '" text-anchor="middle" font-family="Arial" font-size="12" fill="#1A1A1A">' + u + x.toLocaleString("en-GB") + '</text>';
    if (o.zLabels !== false) g += '<text x="' + X(x) + '" y="' + (base + 34) + '" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#E36533">z = ' + zt + '</text>';
  });
  if (o.dashed) o.dashed.forEach((x) => { g += '<line x1="' + X(x) + '" y1="' + Y(pdf(x)) + '" x2="' + X(x) + '" y2="' + base + '" stroke="#1A1A1A" stroke-dasharray="4 3"/>'; });
  if (o.area) {
    const ax = o.areaAt !== undefined ? o.areaAt : (Math.max(a, lo) + Math.min(b, hi)) / 2;
    const ay = o.areaY !== undefined ? o.areaY : (base + Y(pdf(ax))) / 2 + 6;
    g += '<text x="' + X(ax) + '" y="' + ay + '" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#1A1A1A">' + o.area + '</text>';
  }
  if (o.note) g += '<text x="' + X(o.note.at) + '" y="' + (o.note.y || T + 14) + '" text-anchor="' + (o.note.anchor || "middle") + '" font-family="Arial" font-size="12" fill="#555555">' + o.note.text + '</text>';
  return g + "</svg>";
}
// Several small curves side by side (for "area to the left of b minus area to the left of a").
function nrow(items, sep) {
  return '<div style="display:flex;flex-wrap:wrap;align-items:center;gap:8px">' +
    items.map((it, i) => (i ? '<span style="font-size:26px;font-weight:bold;color:#1A1A1A">' + sep[i - 1] + '</span>' : '') +
      '<div style="flex:1;min-width:190px">' + ncurve(Object.assign({ w: 300, h: 150 }, it)) + '</div>').join("") + "</div>";
}

      steps: [
        { k: "Define the variable", b: String.raw`<p>\(X\) = the number of the 12 firms that fail within a year. Each firm is one <b>trial</b>; a “success” is the event we count, here a firm failing.</p>` },
        { k: "Check the four conditions", b: String.raw`<ul><li><b>Fixed number of trials:</b> \(n = 12\) firms.</li>
          <li><b>Two outcomes</b> for each firm: fails or survives.</li>
          <li><b>Same probability</b> for every firm: \(p = 0.2\).</li>
          <li><b>Independent:</b> the question says each firm fails independently of the others.</li></ul>` },
        { k: "State the distribution", b: String.raw`\[ X \sim B(n, p) = B(12,\ 0.2) \]<span class="answer-line">X is binomial with n = 12 trials and probability of success p = 0.2.</span>` },
      ] },

    { type: "solution", label: "1(b)", title: "Exactly 2 firms fail",
      question: "Find the probability that exactly 2 firms fail.",
      steps: [
        { k: "Define the variable and what we know", b: String.raw`<p>\(X \sim B(12, 0.2)\): \(n = 12\), \(p = 0.2\), so \(1 - p = 0.8\).</p><p>We want \(P(X = 2)\).</p>` },
        { k: "Write the formula", b: String.raw`\[ P(X = k) = \binom{n}{k}\, p^{k}\,(1-p)^{n-k} \]
          <p>\(\binom{n}{k}\) counts the ways of choosing which \(k\) firms fail; \(p^k (1-p)^{n-k}\) is the probability of any one of those ways.</p>` },
        { k: "Substitute", b: String.raw`\[ P(X = 2) = \binom{12}{2}\,(0.2)^{2}\,(0.8)^{10} \]` },
        { k: "Compute", b: String.raw`\[ \binom{12}{2} = \frac{12 \times 11}{2} = 66, \qquad (0.2)^2 = 0.04, \qquad (0.8)^{10} = 0.1074 \]
          \[ P(X = 2) = 66 \times 0.04 \times 0.1074 = 0.2835 \]<span class="answer-line">There is a 28% chance that exactly 2 of the 12 firms fail.</span>
          <p>Check in R: <code>dbinom(2, size = 12, prob = 0.2)</code> gives 0.2835.</p>` },
      ],
      sim: { intro: "Each draw is one imaginary year: each of the 12 firms fails with probability 0.2. Orange squares are years in which exactly 2 firms failed.",
        target: 0.2835, targetLabel: "Exact P(X = 2)", xLabel: "Years simulated (log scale)", yLabel: "Share of years with X = 2",
        maxDraws: 10000, tol: 0.01, legend: { hit: "Exactly 2 fail", miss: "Some other number" },
        draw: () => ({ hit: drawFails() === 2 }) } },

    { type: "solution", label: "1(c)", title: "3 or more fail",
      question: "Find the probability that 3 or more fail. (Hint: use the complement.)",
      steps: [
        { k: "Define the event and what we know", b: String.raw`<p>We want \(P(X \ge 3) = P(X = 3) + P(X = 4) + \dots + P(X = 12)\): ten terms. Its complement, \(X \le 2\), has only three.</p>
          <p>From 1(b), \(P(X = 2) = 0.2835\).</p>` },
        { k: "Write the formula", b: String.raw`<p>The complement rule, with the binomial formula for each term:</p>
          \[ P(X \ge 3) = 1 - P(X \le 2) = 1 - \big[P(X = 0) + P(X = 1) + P(X = 2)\big] \]` },
        { k: "Substitute and compute the two missing terms", b: String.raw`\[ P(X = 0) = \binom{12}{0}(0.2)^0(0.8)^{12} = 0.8^{12} = 0.0687 \]
          \[ P(X = 1) = \binom{12}{1}(0.2)^1(0.8)^{11} = 12 \times 0.2 \times 0.0859 = 0.2062 \]` },
        { k: "Solve", b: String.raw`\[ P(X \le 2) = 0.0687 + 0.2062 + 0.2835 = 0.5583 \]
          \[ P(X \ge 3) = 1 - 0.5583 = 0.4417 \]<span class="answer-line">There is a 44% chance that 3 or more of the 12 firms fail.</span>
          <p>Check in R: <code>1 - pbinom(2, size = 12, prob = 0.2)</code> gives 0.4417.</p>` },
      ],
      sim: { intro: "Each draw is one imaginary year of 12 firms. Orange squares are years with 3 or more failures.",
        target: 0.4417, targetLabel: "Exact P(X ≥ 3)", xLabel: "Years simulated (log scale)", yLabel: "Share of years with X ≥ 3",
        maxDraws: 10000, tol: 0.01, legend: { hit: "3 or more fail", miss: "0, 1 or 2 fail" },
        draw: () => ({ hit: drawFails() >= 3 }) } },

    { type: "solution", label: "1(d)", title: "Mean and standard deviation",
      question: "Find the mean and the standard deviation of <i>X</i>.",
      steps: [
        { k: "Write the formulas", b: String.raw`<p>For a binomial \(X \sim B(n, p)\):</p>
          \[ E(X) = np \qquad \mathrm{Var}(X) = np(1-p) \qquad \sigma = \sqrt{np(1-p)} \]` },
        { k: "Substitute and solve: the mean", b: String.raw`\[ E(X) = 12 \times 0.2 = 2.4 \]<span class="answer-line">On average 2.4 of the 12 firms fail.</span>` },
        { k: "Substitute and solve: the standard deviation", b: String.raw`\[ \mathrm{Var}(X) = 12 \times 0.2 \times 0.8 = 1.92 \qquad \sigma = \sqrt{1.92} = 1.39 \]` },
        { k: "Interpret", b: "<span class='answer-line'>In a typical year about 2.4 firms fail, give or take about 1.4.</span><p>No single year has 2.4 failures: it is the long-run average across many years.</p>" },
      ],
      sim: { intro: "Each draw is one imaginary year: the number of the 12 firms that fail. The line is the running average number of failures.",
        mode: "mean", target: 2.4, targetLabel: "Exact E(X)", xLabel: "Years simulated (log scale)", yLabel: "Average failures a year",
        maxDraws: 10000, tol: 0.1, decimals: 2, yRange: [0, 6], yTicks: [0, 1, 2, 3, 4, 5, 6],
        draw: () => ({ value: drawFails() }) } },

    // ================================================================== Question 2
    { type: "section", eyebrow: "Question 2", title: "The Normal Distribution",
      text: "<p>Monthly household spending on energy in a city is approximately normal with mean £150 and standard deviation £30.</p>" },

    { type: "solution", label: "2(a)", title: "A household that spends £120",
      question: "What is the <i>z</i>-score of a household that spends £120? Interpret it, and find the probability that a household spends less than £120.",
      steps: [
        { k: "Define the variable and what we know", b: String.raw`<p>\(X\) = a household's monthly energy spending, in £.</p>\[ X \sim N(\mu, \sigma^2) = N(150,\ 30^2) \]
          <p>We want the \(z\)-score of \(x = 120\), and \(P(X < 120)\): the area to the <b>left</b> of 120.</p>` +
          ncurve(Object.assign({}, SP, { b: 120, ticks: [90, 120, 150, 180, 210], zLabels: false, area: "?", areaAt: 108, areaY: 132, alt: "Normal curve centred on £150 with the area to the left of £120 shaded" })) },
        { k: "Write the formula", b: String.raw`<p>Standardise: how many standard deviations \(x\) is from the mean.</p>\[ z = \frac{x - \mu}{\sigma}, \qquad P(X < x) = P(Z < z) \]` },
        { k: "Substitute and compute z", b: String.raw`\[ z = \frac{120 - 150}{30} = \frac{-30}{30} = -1 \]<span class="answer-line">The household spends one standard deviation less than the average household.</span>` },
        { k: "Read the probability", b: String.raw`\[ P(X < 120) = P(Z < -1) = 0.1587 \]<span class="answer-line">About 16% of households spend less than £120 a month.</span>` +
          ncurve(Object.assign({}, SP, { b: 120, ticks: [90, 120, 150, 180, 210], area: "0.1587", areaAt: 106, areaY: 128, dashed: [120], alt: "The area to the left of £120, z = −1, is 0.1587" })) + String.raw`
          <p>From the table, \(P(Z < 1) = 0.8413\), so \(P(Z < -1) = 1 - 0.8413\). In R: <code>pnorm(120, 150, 30)</code>.</p>` },
      ],
      sim: { intro: "Each draw is one household's monthly spending, drawn from N(150, 30²). Orange squares are households spending less than £120.",
        target: 0.1587, targetLabel: "Exact P(X < 120)", xLabel: "Households drawn (log scale)", yLabel: "Share spending under £120",
        maxDraws: 10000, tol: 0.01, legend: { hit: "Under £120", miss: "£120 or more" },
        draw: () => ({ hit: drawSpend() < 120 }) } },

    { type: "solution", label: "2(b)", title: "Between £135 and £180",
      question: "Find the probability that a household spends between £135 and £180.",
      steps: [
        { k: "Define the event", b: String.raw`<p>We want \(P(135 < X < 180)\): the area under the curve between 135 and 180, a little below the mean to one standard deviation above it.</p>` +
          ncurve(Object.assign({}, SP, { a: 135, b: 180, ticks: [90, 135, 150, 180, 210], zLabels: false, area: "?", alt: "Normal curve with the area between £135 and £180 shaded" })) },
        { k: "Write the formula", b: String.raw`<p>Standardise both ends; the area between is the area to the left of the upper end minus the area to the left of the lower end.</p>
          \[ P(a < X < b) = P(Z < z_b) - P(Z < z_a), \qquad z = \frac{x - \mu}{\sigma} \]` },
        { k: "Substitute", b: String.raw`\[ z_a = \frac{135 - 150}{30} = -0.5 \qquad z_b = \frac{180 - 150}{30} = 1 \]` },
        { k: "Compute", b: String.raw`\[ P(135 < X < 180) = P(Z < 1) - P(Z < -0.5) = 0.8413 - 0.3085 = 0.5328 \]<span class="answer-line">About 53% of households spend between £135 and £180 a month.</span>` +
          nrow([Object.assign({}, SP, { b: 180, ticks: [180], area: "0.8413", areaAt: 140, alt: "Area to the left of z = 1: 0.8413" }),
                Object.assign({}, SP, { b: 135, ticks: [135], area: "0.3085", areaAt: 100, areaY: 52, alt: "Area to the left of z = −0.5: 0.3085" }),
                Object.assign({}, SP, { a: 135, b: 180, ticks: [135, 180], area: "0.5328", alt: "Area between z = −0.5 and z = 1: 0.5328" })], ["−", "="]) + String.raw`
          <p>In R: <code>pnorm(180, 150, 30) - pnorm(135, 150, 30)</code>.</p>` },
      ],
      sim: { intro: "Each draw is one household from N(150, 30²). Orange squares are households spending between £135 and £180.",
        target: 0.5328, targetLabel: "Exact P(135 < X < 180)", xLabel: "Households drawn (log scale)", yLabel: "Share between £135 and £180",
        maxDraws: 10000, tol: 0.01, legend: { hit: "£135 to £180", miss: "Outside" },
        draw: () => { const x = drawSpend(); return { hit: x > 135 && x < 180 }; } } },

    { type: "solution", label: "2(c)", title: "Who qualifies for support?",
      question: "The city wants to offer support to the 10% of households with the highest spending. Above what level of spending would a household qualify?",
      steps: [
        { k: "What is different this time", b: String.raw`<p>Now we know the <b>probability</b> and want the <b>value</b>: the spending \(x\) with 10% of households above it,</p>\[ P(X > x) = 0.10 \quad\Longleftrightarrow\quad P(X < x) = 0.90 \]` +
          ncurve(Object.assign({}, SP, { a: 188.45, ticks: [150], zLabels: false, area: "0.10", areaAt: 232, areaY: 138, dashed: [188.45],
            note: { at: 188.45, y: 40, anchor: "start", text: "  x = ?" }, alt: "Normal curve with the top 10% shaded to the right of an unknown cut-off" })) },
        { k: "Find z from the table", b: String.raw`<p>Look inside the table for 0.90: \(P(Z < 1.28) = 0.8997\), the closest entry.</p>\[ z = 1.28 \]` },
        { k: "Write the formula: reverse the standardisation", b: String.raw`\[ z = \frac{x - \mu}{\sigma} \quad\Longrightarrow\quad x = \mu + z\,\sigma \]` },
        { k: "Substitute and compute", b: String.raw`\[ x = 150 + 1.28 \times 30 = 150 + 38.40 = 188.40 \]<span class="answer-line">Households spending more than about £188 a month qualify.</span>` +
          ncurve(Object.assign({}, SP, { a: 188.4, ticks: [150, 188.4], area: "0.10", areaAt: 232, areaY: 122, dashed: [188.4],
            note: { at: 120, y: 120, text: "0.90" }, alt: "The top 10% lie above £188.40, z = 1.28" })) + String.raw`
          <p>R uses the exact \(z = 1.2816\): <code>qnorm(0.90, 150, 30)</code> gives £188.45.</p>` },
      ],
      sim: { intro: "Each draw is one household from N(150, 30²). Orange squares are households above the cut-off of £188.45. The share should settle at 10%.",
        target: 0.10, targetLabel: "Target share above £188.45", xLabel: "Households drawn (log scale)", yLabel: "Share above £188.45",
        maxDraws: 10000, tol: 0.01, yRange: [0, 0.4], yTicks: [0, 0.1, 0.2, 0.3, 0.4], legend: { hit: "Above £188.45", miss: "£188.45 or less" },
        draw: () => ({ hit: drawSpend() > 188.45 }) } },

    // ================================================================== Question 3
    { type: "section", eyebrow: "Question 3", title: "Concepts",
      text: "<p>Answer each part in one or two sentences.</p>" },

    { type: "solution", label: "3(a)", title: "Standard deviation or standard error?",
      question: "What is the difference between the standard deviation of a variable and the standard error of its sample mean?",
      steps: [
        { k: "Standard deviation", b: String.raw`<p>\(\sigma\) measures how much <b>individual values</b> differ from one another: how far one household's spending, or one worker's wage, typically is from the mean.</p>` },
        { k: "Standard error", b: String.raw`<p>The standard error measures how much the <b>sample mean</b> would differ from one sample to the next. It is the standard deviation of the sampling distribution of \(\bar{x}\):</p>\[ \mathrm{SE}(\bar{x}) = \frac{\sigma}{\sqrt{n}} \]` },
        { k: "The difference in one sentence", b: "<span class='answer-line'>The standard deviation describes the spread of the data; the standard error describes the spread of an estimate. As the sample grows, the standard deviation stays about the same but the standard error shrinks.</span>" },
      ] },

    { type: "solution", label: "3(b)", title: "The central limit theorem",
      question: "State the central limit theorem in your own words. What does it say about the shape of the data themselves?",
      steps: [
        { k: "The statement", b: String.raw`<p>Take a large random sample from <b>any</b> population with mean \(\mu\) and a finite standard deviation \(\sigma\). Then the sample mean is approximately normal:</p>\[ \bar{x} \approx N\!\left(\mu,\ \frac{\sigma^2}{n}\right) \]` },
        { k: "What is new", b: "<p>We already knew the centre (μ) and the spread (σ ÷ √n) of the sampling distribution. The central limit theorem adds its <b>shape</b>: a bell, whatever the shape of the population.</p>" },
        { k: "What it does not say", b: "<span class='answer-line'>It says nothing about the data becoming normal: the individual values keep the population's shape (skewed wages stay skewed). Only the distribution of the mean becomes bell-shaped.</span><p>Question 7 shows this with the wages of 3,000 workers.</p>" },
      ] },

    // ================================================================== Question 4
    { type: "section", eyebrow: "Question 4", title: "The Standard Error",
      text: "<p>Monthly rents for one-bedroom flats in a city have mean £1,200 and standard deviation £300.</p>" },

    { type: "solution", label: "4(a)", title: "A sample of 36 flats",
      question: "Find the standard error of the mean rent in a random sample of 36 flats.",
      steps: [
        { k: "Define what we know", b: String.raw`<p>Population: \(\mu = 1{,}200\), \(\sigma = 300\). Sample size \(n = 36\).</p><p>We want \(\mathrm{SE}(\bar{x})\): how much the mean rent of 36 flats would vary from sample to sample.</p>` },
        { k: "Write the formula", b: String.raw`\[ \mathrm{SE}(\bar{x}) = \frac{\sigma}{\sqrt{n}} \]` },
        { k: "Substitute", b: String.raw`\[ \mathrm{SE}(\bar{x}) = \frac{300}{\sqrt{36}} = \frac{300}{6} \]` },
        { k: "Compute and interpret", b: String.raw`\[ \mathrm{SE}(\bar{x}) = 50 \]<span class="answer-line">The mean rent of 36 flats is typically about £50 away from £1,200, although a single flat is typically £300 away.</span>
          <p>By the central limit theorem, about 68% of samples of 36 flats have a mean within one standard error (£1,150 to £1,250).</p>` +
          ncurve(Object.assign({}, RENT, { a: 1150, b: 1250, ticks: [1100, 1150, 1200, 1250, 1300], zLabels: false, area: "68%",
            title: "Sampling distribution of the mean rent of 36 flats", alt: "Normal curve for the mean rent, centred on £1,200 with standard error £50; the area between £1,150 and £1,250 is shaded, 68%" })) + String.raw`` },
      ],
      sim: { intro: "Each draw is a whole sample: 36 flats, each rent drawn from a population with mean £1,200 and standard deviation £300. Orange squares are samples whose mean rent is within £50 (one standard error) of £1,200. The share settles near 68%.",
        target: 0.6827, targetLabel: "Normal: within ±1 SE", xLabel: "Samples of 36 flats (log scale)", yLabel: "Share of means within £50",
        maxDraws: 10000, tol: 0.01, legend: { hit: "Mean within £50 of £1,200", miss: "Further away" },
        draw: () => ({ hit: Math.abs(drawRentMean() - 1200) < 50 }) } },

    { type: "solution", label: "4(b)", title: "How large a sample for £10?",
      question: "How large a sample is needed for a standard error of £10?",
      steps: [
        { k: "Define what we want", b: String.raw`<p>The sample size \(n\) for which \(\mathrm{SE}(\bar{x}) = 10\), with \(\sigma = 300\).</p>` },
        { k: "Write the formula, solved for n", b: String.raw`\[ \frac{\sigma}{\sqrt{n}} = \mathrm{SE} \quad\Longrightarrow\quad \sqrt{n} = \frac{\sigma}{\mathrm{SE}} \quad\Longrightarrow\quad n = \left(\frac{\sigma}{\mathrm{SE}}\right)^{2} \]` },
        { k: "Substitute", b: String.raw`\[ n = \left(\frac{300}{10}\right)^{2} = 30^2 \]` },
        { k: "Compute", b: String.raw`\[ n = 900 \]<span class="answer-line">A random sample of 900 flats gives a standard error of £10.</span>` },
      ] },

    { type: "solution", label: "4(c)", title: "The cost of precision",
      question: "What do your answers to (a) and (b) tell you about the cost of precision?",
      steps: [
        { k: "Compare (a) and (b)", b: String.raw`<p>From \(n = 36\) to \(n = 900\): the standard error falls from £50 to £10, five times smaller, but the sample is \(900 / 36 = 25\) times larger.</p>` },
        { k: "Why: the square root", b: String.raw`<p>\(n\) enters the standard error through \(\sqrt{n}\). To divide the standard error by \(k\) you must multiply the sample by \(k^2\):</p>\[ \frac{\sigma}{\sqrt{k^2 n}} = \frac{1}{k}\cdot\frac{\sigma}{\sqrt{n}} \]` },
        { k: "Conclude", b: "<span class='answer-line'>Precision has diminishing returns: halving the standard error needs four times the sample, and five times the precision needs 25 times the sample. Each extra flat buys less precision than the one before.</span>" },
      ] },

    // ================================================================== R questions
    { type: "section", eyebrow: "Questions using RStudio", title: "Questions 5 to 7 in R",
      text: "<p>Bring your laptop to the seminar. The scripts <code>week2.R</code> and <code>week3.R</code> on Moodle contain the examples from the lecture. For Question 7 the data are the wages of 3,000 workers (in $ thousands), which we treat as a population: <code>library(ISLR); wage &lt;- Wage$wage</code>. On this page they are already loaded as <code>wage</code>, so you can skip that line. R takes a minute to start the first time; the status at the top of the page turns green when it is ready. Later steps use objects created in earlier steps, as in a script, so run the steps in order.</p>" },

    { type: "r", title: "5. Checking your answers in R",
      desc: "Use <code>dbinom()</code> and <code>pbinom()</code> to check your answers to Question 1(b) and (c), <code>pnorm()</code> to check Question 2(a) and (b), and <code>qnorm()</code> to check Question 2(c).",
      h1: "Each function answers one kind of question: the probability of exactly one value, the probability of a value or less, an area to the left under the normal curve, and the value that leaves a given area to its left. For “3 or more”, use the complement, as in 1(c).",
      h2: "<code>dbinom(k, size, prob)</code> gives P(X = k); <code>pbinom(k, size, prob)</code> gives P(X ≤ k). <code>pnorm(x, mean, sd)</code> gives P(X &lt; x); <code>qnorm(p, mean, sd)</code> gives the x with P(X &lt; x) = p.",
      h3: `# Question 1: X ~ B(12, 0.2)
dbinom(2, size = 12, prob = 0.2)           # 1(b) P(X = 2)
1 - pbinom(2, size = 12, prob = 0.2)       # 1(c) P(X >= 3) = 1 - P(X <= 2)

# Question 2: X ~ N(150, 30^2)
(120 - 150) / 30                           # 2(a) z-score
pnorm(120, mean = 150, sd = 30)            # 2(a) P(X < 120)
pnorm(180, 150, 30) - pnorm(135, 150, 30)  # 2(b) P(135 < X < 180)
qnorm(0.90, mean = 150, sd = 30)           # 2(c) the top 10% start here`,
      h3note: "R prints 0.2835, 0.4417, −1, 0.1587, 0.5328 and 188.4465: the same as the answers by hand. The only difference is 2(c): with z = 1.28 from the table we got £188.40; R uses the exact z = 1.2816 and gives £188.45.",
      code: "# Check your answers to Questions 1 and 2\n" },

    { type: "r", title: "6(a). Simulate 10,000 years of 12 firms",
      desc: "Simulate the number of failures among the 12 firms in Question 1 for 10,000 imaginary years: <code>fails &lt;- rbinom(10000, size = 12, prob = 0.2)</code>.",
      h1: "Each of the 10,000 numbers is one imaginary year: how many of the 12 firms failed that year. Fix the random numbers first so your results can be repeated.",
      h2: "<code>set.seed(2026)</code> fixes the random draws. <code>rbinom(n, size, prob)</code> draws n binomial numbers. Look at the result with <code>head()</code> and <code>table()</code>.",
      h3: `set.seed(2026)                    # so that we all get the same draws
fails <- rbinom(10000, size = 12, prob = 0.2)
head(fails, 20)                   # the first 20 years
table(fails)                      # how often each number of failures came up`,
      h3note: "With this seed the first years have 3, 2, 1, 2, 2, 0, … failures. <code>table(fails)</code> shows 2 failures is the most common (2,875 of the 10,000 years), and 8 failures happened only 5 times. The object <code>fails</code> is used in (b) and (c).",
      code: "# Simulate the number of failures among 12 firms for 10,000 years\n" },

    { type: "r", title: "6(b). Mean and standard deviation of the simulation",
      desc: "Find <code>mean(fails)</code> and <code>sd(fails)</code>. How do they compare with your answers to Question 1(d)?",
      h1: "Compare the simulated mean and standard deviation with the formulas np and √(np(1 − p)).",
      h2: "<code>mean()</code> and <code>sd()</code> of <code>fails</code>. Compute the theory with <code>12 * 0.2</code> and <code>sqrt(12 * 0.2 * 0.8)</code>.",
      h3: `mean(fails)                       # simulated mean
sd(fails)                         # simulated standard deviation
c(theory_mean = 12 * 0.2, theory_sd = sqrt(12 * 0.2 * 0.8))`,
      h3note: "The simulation gives a mean of 2.397 and a standard deviation of 1.383, against 2.4 and 1.386 from the formulas in 1(d). Very close, but not exactly equal: see (c).",
      code: "# Compare the simulated mean and sd with Question 1(d)\n" },

    { type: "r", title: "6(c). Three or more failures",
      desc: "Find <code>mean(fails &gt;= 3)</code>. How does it compare with your answer to Question 1(c)? Why are the two not exactly equal?",
      h1: "<code>fails &gt;= 3</code> asks a TRUE/FALSE question about each year. What is the average of a list of TRUEs and FALSEs?",
      h2: "R treats TRUE as 1 and FALSE as 0, so <code>mean()</code> of a TRUE/FALSE vector is the share that are TRUE. Compare with <code>1 - pbinom(2, 12, 0.2)</code>.",
      h3: `mean(fails >= 3)                  # share of the 10,000 years with 3 or more failures
1 - pbinom(2, 12, 0.2)            # the exact answer from Question 1(c)`,
      h3note: "The simulated share is 0.4381, against the exact 0.4417: 0.004 below. The written step below asks why.",
      code: "# Share of simulated years with 3 or more failures\n" },

    { type: "write", title: "6(c). Why are the two not exactly equal?",
      desc: "Explain in one or two sentences why the simulated share in 6(c) is not exactly 0.4417, and what would bring it closer.",
      h1: "Run 6(a) and 6(c) again with a different number in <code>set.seed()</code>. What happens to the share?",
      h2: "<ul><li>A simulation uses a finite number of random draws.</li><li>Sampling variability: a different set of draws gives a different share.</li><li>The law of large numbers.</li></ul>",
      h3: "<p>The simulated share comes from 10,000 random years, so it varies from one run to the next: with 10,000 draws it is typically within about 0.01 of the exact probability, and here it is 0.004 below. The exact 0.4417 is what the share would settle on with infinitely many years (the law of large numbers). More draws, say 1,000,000, bring it closer; a different seed gives a slightly different answer.</p>" },

    { type: "r", title: "7(a). The population and 1,000 samples of 25", plot: { width: 900, height: 380 },
      desc: "Find the population mean and standard deviation with <code>mean(wage)</code> and <code>sd(wage)</code>, and draw a histogram of the wages. Then draw 1,000 samples of 25 workers and store their means: <code>means25 &lt;- replicate(1000, mean(sample(wage, 25)))</code>. Draw a histogram of <code>means25</code> and compare its shape with the wages themselves. Compare <code>sd(means25)</code> with σ / √n.",
      h1: "The 3,000 wages are the population: their mean and standard deviation are μ and σ. Each of the 1,000 samples gives one sample mean; the histogram of those means is the sampling distribution. Put the two histograms side by side, on the same scale, to compare them.",
      h2: "<code>mean()</code>, <code>sd()</code>, <code>hist()</code>. <code>sample(wage, 25)</code> draws 25 workers; <code>replicate(1000, ...)</code> repeats it. <code>par(mfrow = c(1, 2))</code> puts two plots side by side, and <code>xlim = range(wage)</code> gives them the same scale. σ / √n is <code>sd(wage) / sqrt(25)</code>.",
      h3: `mean(wage)                        # mu
sd(wage)                          # sigma

set.seed(2026)
means25 <- replicate(1000, mean(sample(wage, 25)))

par(mfrow = c(1, 2))
hist(wage, breaks = 30, col = "#E1EBF5",
     main = "Wages of 3,000 workers", xlab = "Wage ($ thousands)")
hist(means25, breaks = 30, col = "#E36533", xlim = range(wage),
     main = "1,000 sample means, n = 25", xlab = "Sample mean ($ thousands)")
par(mfrow = c(1, 1))

mean(means25)                     # centred on mu
sd(means25)                       # the spread of the sample means
sd(wage) / sqrt(25)               # sigma / sqrt(n)`,
      h3note: "μ = 111.7 and σ = 41.7 ($ thousands). The wages are skewed to the right, with a small separate group of high earners near 300. The 1,000 sample means are centred on μ (their mean is 111.3) but are much narrower and far more symmetric, though still a little skewed with n = 25. Their standard deviation is 8.19, against σ / √n = 41.7 / 5 = 8.35. The object <code>means25</code> is used in (b).",
      code: "# Population mean, sd and histogram; then 1,000 sample means of 25 workers\n" },

    { type: "r", title: "7(b). Samples of 100 workers", plot: { width: 900, height: 380 },
      desc: "Repeat with samples of 100 workers. What happens to the standard deviation of the sample means, and by what factor?",
      h1: "Change 25 to 100 and compare the standard deviation of the new sample means with the one from (a). Draw the two histograms on the same scale.",
      h2: "<code>means100 &lt;- replicate(1000, mean(sample(wage, 100)))</code>. Compare <code>sd(means100)</code> with <code>sd(wage) / sqrt(100)</code>, and divide <code>sd(means25)</code> by <code>sd(means100)</code>.",
      h3: `means100 <- replicate(1000, mean(sample(wage, 100)))

par(mfrow = c(1, 2))
hist(means25,  breaks = 30, col = "#E36533", xlim = c(80, 145),
     main = "Sample means, n = 25", xlab = "Sample mean ($ thousands)")
hist(means100, breaks = 30, col = "#2A5A88", xlim = c(80, 145),
     main = "Sample means, n = 100", xlab = "Sample mean ($ thousands)")
par(mfrow = c(1, 1))

sd(means100)                      # spread of the sample means, n = 100
sd(wage) / sqrt(100)              # sigma / sqrt(n)
sd(means25) / sd(means100)        # by what factor did it fall?`,
      h3note: "Run straight after (a), the standard deviation of the sample means falls from 8.19 to 4.04, against σ / √n = 4.17; the ratio is 2.03. Four times the sample halves the spread, because √4 = 2. The histogram for n = 100 is also narrower and closer to a bell.",
      code: "# Repeat with samples of 100 workers\n" },

    { type: "write", title: "7. What do the histograms show?",
      desc: "In two or three sentences: how does the shape of the sample means compare with the shape of the wages, what happened to their spread when n went from 25 to 100, and which result from the lecture explains it?",
      h1: "Look at the three histograms side by side: the wages, the means of 25, the means of 100. What changes, and what stays the same?",
      h2: "<ul><li>The centre: μ.</li><li>The spread: σ / √n.</li><li>The shape: the central limit theorem.</li><li>Do the wages themselves become normal?</li></ul>",
      h3: "<p>The wages are skewed to the right, but the sample means are much more symmetric and bell-shaped, and more so with n = 100 than with n = 25: the central limit theorem. All three are centred on μ = 111.7, and the spread of the sample means is close to σ / √n: 8.2 for n = 25 and 4.0 for n = 100, so four times the sample halves the standard error. The wages themselves do not become normal; only their mean does.</p>" },

    { type: "r", title: "Extension: Question 4 by simulation", plot: { width: 680, height: 420 },
      desc: "Rents have mean £1,200 and standard deviation £300. Draw 10,000 samples of 36 flats (draw the rents from a normal distribution with <code>rnorm()</code>) and store each sample's mean rent. Is the standard deviation of the 10,000 means close to your standard error in 4(a)? What share of the means lie within £50 of £1,200?",
      h1: "Each sample is 36 random rents; each sample gives one mean. The standard deviation of the 10,000 means is the standard error, found by simulation.",
      h2: "<code>replicate(10000, mean(rnorm(36, mean = 1200, sd = 300)))</code>. Then <code>sd()</code> of the result, and <code>mean(abs(rent_means - 1200) &lt; 50)</code> for the share within £50.",
      h3: `set.seed(2026)
rent_means <- replicate(10000, mean(rnorm(36, mean = 1200, sd = 300)))

sd(rent_means)                          # compare with 300 / sqrt(36) = 50
mean(abs(rent_means - 1200) < 50)       # share within one standard error

hist(rent_means, breaks = 40, col = "#E1EBF5",
     main = "10,000 mean rents, samples of 36 flats", xlab = "Mean rent (£)")
abline(v = 1200 + c(-50, 50), lty = 2, col = "#E36533", lwd = 2)`,
      h3note: "The standard deviation of the 10,000 mean rents is 50.4, close to the standard error of £50 from 4(a), and 68.3% of the means lie within £50 of £1,200: about 68%, as for any normal within one standard deviation. Try 900 flats instead of 36: the standard deviation of the means falls to about £10, as in 4(b).",
      code: "# Simulate 10,000 samples of 36 flats and look at the spread of their mean rents\n" },
  ],
};
