// One random draw for each simulation.
function drawNormal(mu, sd) {     // Box–Muller: one draw from N(mu, sd^2)
  const u = 1 - Math.random(), v = Math.random();
  return mu + sd * Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
}
// Question 1(a): if the programme had no effect, the gap between the two group means is roughly normal,
// centred on 0 with standard error 10.97 (Problem Set 5, Question 7). Is the gap $20 or more in either direction?
function noEffectGap() { return Math.abs(drawNormal(0, 10.97)) >= 20; }
// Question 2: one small firm. It under-reports with probability 0.05; each check flags 80% of under-reporters
// and 10% of the others, independently.
function firm() {
  const u = Math.random() < 0.05, rate = u ? 0.80 : 0.10;
  return { u, f1: Math.random() < rate, f2: Math.random() < rate };
}
// Question 3: draw a district's share p from the prior Beta(4, 6) (the 4th smallest of 9 uniforms),
// then survey 20 of its firms. Keep only districts where 12 of 20 accept mobile payments.
function betaInt(a, b) { const u = []; for (let i = 0; i < a + b - 1; i++) u.push(Math.random()); u.sort((x, y) => x - y); return u[a - 1]; }
function district() {
  const p = betaInt(4, 6); let x = 0;
  for (let i = 0; i < 20; i++) if (Math.random() < p) x++;
  return { p, x };
}

// Small sketch of beta curves (inline SVG): each curve is { a, b, col, label, at (where to put the label), dash },
// shade: { a, b, lo, hi } fills the area under one curve between lo and hi; ticks: values on the axis (0 to 1).
function lbeta(a, b) { return lg(a) + lg(b) - lg(a + b); }
function lg(z) {  // log-gamma (Lanczos)
  const g = 7, c = [0.99999999999980993, 676.5203681218851, -1259.1392167224028, 771.32342877765313, -176.61502916214059,
    12.507343278686905, -0.13857109526572012, 9.9843695780195716e-6, 1.5056327351493116e-7];
  if (z < 0.5) return Math.log(Math.PI / Math.sin(Math.PI * z)) - lg(1 - z);
  z -= 1; let x = c[0]; for (let i = 1; i < g + 2; i++) x += c[i] / (z + i);
  const t = z + g + 0.5; return 0.5 * Math.log(2 * Math.PI) + (z + 0.5) * Math.log(t) - t + Math.log(x);
}
function dbeta(p, a, b) { if (p <= 0 || p >= 1) return (p <= 0 && a < 1) || (p >= 1 && b < 1) ? Infinity : (a === 1 && p <= 0) || (b === 1 && p >= 1) ? Math.exp(-lbeta(a, b)) : 0; return Math.exp((a - 1) * Math.log(p) + (b - 1) * Math.log(1 - p) - lbeta(a, b)); }
function bcurve(o) {
  const W = o.w || 520, H = o.h || 200, L = 14, R = 14, T = o.title ? 26 : 12, B = 30;
  const lo = o.lo || 0, hi = o.hi || 1, n = 240;
  const X = (x) => L + (x - lo) / (hi - lo) * (W - L - R);
  let ymax = 0;
  o.curves.forEach((c) => { for (let i = 1; i < n; i++) { const x = lo + (hi - lo) * i / n; ymax = Math.max(ymax, dbeta(x, c.a, c.b)); } });
  ymax *= 1.08;
  const Y = (v) => T + (1 - Math.min(v, ymax) / ymax) * (H - T - B), base = Y(0);
  let g = '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="' + (o.alt || "Beta curves") +
    '" style="width:100%;max-width:' + W + 'px;display:block;margin:10px 0;background:#FFFFFF;border-radius:8px">';
  if (o.title) g += '<text x="' + (W / 2) + '" y="17" text-anchor="middle" font-family="Arial" font-size="13" font-weight="bold" fill="#1A1A1A">' + o.title + '</text>';
  if (o.shade) {
    const s = o.shade; let p = "M" + X(s.lo).toFixed(1) + " " + base;
    for (let i = 0; i <= n; i++) { const x = s.lo + (s.hi - s.lo) * i / n; p += "L" + X(x).toFixed(1) + " " + Y(dbeta(x, s.a, s.b)).toFixed(1); }
    g += '<path d="' + p + "L" + X(s.hi).toFixed(1) + " " + base + 'Z" fill="' + (s.col || "#E36533") + '" fill-opacity="0.45"/>';
  }
  o.curves.forEach((c) => {
    let d = "";
    for (let i = 0; i <= n; i++) { const x = lo + (hi - lo) * i / n; const y = dbeta(Math.min(Math.max(x, 1e-6), 1 - 1e-6), c.a, c.b); d += (i ? "L" : "M") + X(x).toFixed(1) + " " + Y(y).toFixed(1); }
    g += '<path d="' + d + '" fill="none" stroke="' + c.col + '" stroke-width="2.4"' + (c.dash ? ' stroke-dasharray="6 4"' : "") + '/>';
    if (c.label) { const at = c.at !== undefined ? c.at : (c.a - 1) / (c.a + c.b - 2); const ly = Math.max(T + 12, Y(dbeta(at, c.a, c.b)) - 8);
      g += '<text x="' + X(at) + '" y="' + ly + '" text-anchor="' + (c.anchor || "middle") + '" font-family="Arial" font-size="12" font-weight="bold" fill="' + c.col + '">' + c.label + '</text>'; }
  });
  g += '<line x1="' + L + '" y1="' + base + '" x2="' + (W - R) + '" y2="' + base + '" stroke="#1A1A1A" stroke-width="1"/>';
  (o.ticks || [0, 0.2, 0.4, 0.6, 0.8, 1]).forEach((t) => {
    const tk = typeof t === "object" ? t : { x: t, t: String(t) };
    g += '<line x1="' + X(tk.x) + '" y1="' + base + '" x2="' + X(tk.x) + '" y2="' + (base + 5) + '" stroke="#1A1A1A"/>';
    g += '<text x="' + X(tk.x) + '" y="' + (base + 18) + '" text-anchor="middle" font-family="Arial" font-size="12" fill="#1A1A1A">' + tk.t + '</text>';
  });
  (o.dashed || []).forEach((x) => { g += '<line x1="' + X(x) + '" y1="' + (T + 2) + '" x2="' + X(x) + '" y2="' + base + '" stroke="#1A1A1A" stroke-dasharray="4 3"/>'; });
  (o.notes || []).forEach((nt) => { g += '<text x="' + X(nt.at) + '" y="' + nt.y + '" text-anchor="' + (nt.anchor || "middle") + '" font-family="Arial" font-size="12" fill="#555555">' + nt.text + '</text>'; });
  return g + "</svg>";
}

    { type: "section", eyebrow: "Question 2", title: "Bayes' Theorem in Sequence",
      text: "<p>A tax authority knows that 5% of small firms under-report their income. Its audit-selection model flags 80% of the firms that under-report, and wrongly flags 10% of the firms that do not.</p>" },

      steps: [
        { k: "What (b) assumed", b: String.raw`<p>(b) multiplies the two likelihoods, \(0.80 \times 0.80\) and \(0.10 \times 0.10\). That is only valid if the checks are independent given the truth: once we know whether the firm under-reports, the first flag tells us nothing about the second.</p>` },
        { k: "An example where it fails", b: "<p>A second model built from the same tax returns and bank records. An honest firm that looks suspicious to one model will look suspicious to the other, so the second flag is almost guaranteed and adds little.</p>" },
        { k: "Conclude", b: "<span class='answer-line'>Without independence the second flag is not new evidence, and 0.771 overstates the probability.</span>" },
      ] },

    // ================================================================== Question 3
    { type: "section", eyebrow: "Question 3", title: "The Beta–Binomial Model",
      text: "<p>A researcher wants to know <i>p</i>, the share of small firms in a district that accept mobile payments. Surveys in similar districts suggest about 40%, and she treats that experience as worth about 10 firms: her prior is Beta(4, 6). She then surveys 20 firms in the district, and 12 of them accept mobile payments.</p>" +
        String.raw`<p>The results we use: a prior Beta\((a, b)\) and \(x\) successes in \(n\) trials give the posterior Beta\((a + x,\, b + n - x)\), and the mean of Beta\((a, b)\) is \(a / (a + b)\).</p>` },

    { type: "solution", label: "3(a)", title: "The prior",
      question: "What is the mean of her prior? What does <i>a</i> + <i>b</i> = 10 mean?",
      steps: [
        { k: "What we know", b: String.raw`<p>Prior: Beta\((a, b)\) with \(a = 4\), \(b = 6\).</p>` },
        { k: "Write the formula", b: String.raw`\[ E(p) = \frac{a}{a + b} \]` },
        { k: "Substitute and compute", b: String.raw`\[ E(p) = \frac{4}{4 + 6} = 0.40 \]` + bcurve({ curves: [{ a: 4, b: 6, col: BL, label: "Prior Beta(4, 6)" }], dashed: [0.4], alt: "The prior Beta(4, 6), centred near 0.4" }) },
        { k: "What a + b means", b: "<span class='answer-line'>a + b = 10 is how much the prior is worth: as if she had already surveyed 10 firms, 4 accepting and 6 not.</span><p>The larger a + b, the narrower and more confident the prior.</p>" },
      ] },

    { type: "solution", label: "3(b)", title: "The posterior",
      question: "Find her posterior distribution and its mean.",
      steps: [
        { k: "What we know", b: String.raw`<p>Prior \(a = 4\), \(b = 6\). Data: \(n = 20\) firms, \(x = 12\) accept, so \(n - x = 8\) do not.</p>` },
        { k: "Write the formulas", b: String.raw`\[ \text{posterior} = \text{Beta}(a + x,\; b + n - x), \qquad \text{posterior mean} = \frac{a + x}{a + b + n} \]` },
        { k: "Substitute: the posterior", b: String.raw`\[ \text{Beta}(4 + 12,\; 6 + 8) = \text{Beta}(16, 14) \]` },
        { k: "Substitute: the mean", b: String.raw`\[ \frac{16}{30} = 0.533 \]<span class="answer-line">After the survey her best estimate is that about 53% of the district's firms accept mobile payments.</span>` +
          bcurve({ curves: [{ a: 4, b: 6, col: BL, label: "Prior", at: 0.25, dash: true }, { a: 16, b: 14, col: OR, label: "Posterior Beta(16, 14)" }], dashed: [0.6], notes: [{ at: 0.62, y: 26, anchor: "start", text: "data: 12/20 = 0.6" }], alt: "Prior Beta(4, 6) and the narrower posterior Beta(16, 14), between the prior and the data" }) },
      ] },

    { type: "solution", label: "3(c)", title: "A weighted average",
      question: "Show that the posterior mean is a weighted average of the prior mean and the sample proportion. What is the weight on the prior?",
      steps: [
        { k: "What we know", b: String.raw`<p>Prior mean 0.40, worth \(a + b = 10\) firms. Sample proportion \(\hat{p} = x / n = 12 / 20 = 0.60\), worth \(n = 20\) firms.</p>` },
        { k: "Write the formula", b: String.raw`\[ \text{posterior mean} = w \times \frac{a}{a + b} + (1 - w) \times \hat{p}, \qquad w = \frac{a + b}{a + b + n} \]` },
        { k: "Substitute: the weight", b: String.raw`\[ w = \frac{10}{10 + 20} = \frac{1}{3} \]` },
        { k: "Substitute: the average", b: String.raw`\[ \tfrac{1}{3} \times 0.40 + \tfrac{2}{3} \times 0.60 = 0.133 + 0.400 = 0.533 \]<span class="answer-line">The same as in (b). The prior gets a third of the weight: it is worth 10 firms and the data 20.</span>` },
      ] },

    { type: "solution", label: "3(d)", title: "A flat prior",
      question: "A second researcher uses a flat prior, Beta(1, 1). Find his posterior and its mean. Why is it closer to the sample proportion?",
      steps: [
        { k: "Substitute into the rule", b: String.raw`\[ \text{Beta}(1 + 12,\; 1 + 8) = \text{Beta}(13, 9), \qquad \text{mean} = \frac{13}{22} = 0.591 \]` },
        { k: "The weight on the prior", b: String.raw`\[ w = \frac{1 + 1}{1 + 1 + 20} = \frac{2}{22} = 0.09 \]` },
        { k: "Why it is closer to 0.6", b: "<span class='answer-line'>A flat prior is worth only 2 firms, so the data dominate.</span><p>The posterior mean is pulled only slightly from 0.60 towards the flat prior's mean of 0.50.</p>" +
          bcurve({ curves: [{ a: 16, b: 14, col: OR, label: "Her posterior, mean 0.533", at: 0.42, anchor: "end" }, { a: 13, b: 9, col: GR, label: "His posterior, mean 0.591", at: 0.72, anchor: "start" }], dashed: [0.6], alt: "Two posteriors: Beta(16, 14) and Beta(13, 9), the second closer to 0.6" }) },
      ] },

    { type: "solution", label: "3(e)", title: "Reading the posterior",
      question: "For the first researcher, R gives a 95% credible interval of 0.357 to 0.706 and <i>P</i>(<i>p</i> &gt; 0.5) = 0.64. Interpret both numbers. Which sentence can she write that a frequentist with a 95% confidence interval cannot?",
      steps: [
        { k: "The credible interval", b: "<span class='answer-line'>Given her prior and the survey, there is a 95% probability that the share of firms accepting mobile payments is between 35.7% and 70.6%.</span>" +
          bcurve({ curves: [{ a: 16, b: 14, col: OR }], shade: { a: 16, b: 14, lo: 0.357, hi: 0.706 }, ticks: [0, { x: 0.357, t: "0.357" }, { x: 0.706, t: "0.706" }, 1], notes: [{ at: 0.53, y: 150, text: "95%" }], alt: "Posterior Beta(16, 14) with the middle 95% shaded, 0.357 to 0.706" }) },
        { k: "The direct probability", b: "<span class='answer-line'>There is a 64% probability that more than half of the district's firms accept mobile payments.</span>" +
          bcurve({ curves: [{ a: 16, b: 14, col: OR }], shade: { a: 16, b: 14, lo: 0.5, hi: 1 }, ticks: [0, { x: 0.5, t: "0.5" }, 1], notes: [{ at: 0.6, y: 150, text: "0.64" }], alt: "Posterior Beta(16, 14) with the area above 0.5 shaded: 0.64" }) +
          "<p>In R: <code>qbeta(c(0.025, 0.975), 16, 14)</code> and <code>1 - pbeta(0.5, 16, 14)</code>.</p>" },
        { k: "What only she can write", b: String.raw`<p>“There is a 95% probability that \(p\) is between 0.357 and 0.706.” A frequentist treats \(p\) as fixed, so the 95% of a confidence interval describes the method (95% of intervals built this way contain \(p\)), not this interval.</p>` },
        { k: "For comparison", b: String.raw`<p>The Week 5 interval uses the data alone:</p>\[ 0.60 \pm 1.96 \times \sqrt{\frac{0.6 \times 0.4}{20}} = 0.60 \pm 0.21 \quad\Longrightarrow\quad 0.39 \text{ to } 0.81 \]<span class="answer-line">Centred on the sample proportion, because it ignores what was known beforehand.</span>` },
      ],
      sim: { intro: "Bayes by brute force. Each draw is a district: its share p is drawn from her prior Beta(4, 6), then 20 of its firms are surveyed. Only districts where 12 of the 20 accept count (grey squares are the others). Orange squares are kept districts whose share is above 0.5. The share settles on the posterior probability.",
        target: 0.644, targetLabel: "Exact P(p > 0.5 | data)", condLabel: "Districts with 12 of 20", xLabel: "Districts drawn (log scale)", yLabel: "Share with p above 0.5",
        maxDraws: 50000, tol: 0.02, yRange: [0.3, 1], yTicks: [0.4, 0.6, 0.8, 1], legend: { hit: "12 of 20, p > 0.5", miss: "12 of 20, p ≤ 0.5", out: "Not 12 of 20" },
        draw: () => { const r = district(); return { in: r.x === 12, hit: r.p > 0.5 }; } } },

    // ================================================================== Question 4 (R)
    { type: "section", eyebrow: "Questions using RStudio", title: "Question 4: The Training Programme by Resampling",
      text: "<p>The R slides at the end of the Week 6 lecture show the code for this question. In RStudio, load the data with <code>library(causaldata); d &lt;- nsw_mixtape</code>. On this page they are already loaded as <code>d</code>, so you can skip that line. R takes a minute to start the first time; the status at the top of the page turns green when it is ready. Run the steps in order: later steps use objects created in earlier ones.</p>" },

    { type: "r", title: "4(a). The permutation test", plot: { width: 680, height: 400 },
      desc: "Run the permutation test from the lecture slide. What <i>p</i>-value do you get? Start with <code>treated &lt;- d$re78[d$treat == 1]</code> and <code>control &lt;- d$re78[d$treat == 0]</code>.",
      h1: "If training did nothing, the labels are meaningless. Pool all 445 earnings, shuffle them, call the first 185 “trained” and the rest “control”, and record the gap. Do it 10,000 times, then count how many gaps are at least as big as the real one.",
      h2: "<code>sample(all)</code> shuffles a vector; <code>replicate(10000, { ... })</code> repeats the shuffle; <code>mean(abs(perm) &gt;= obs)</code> is the share of shuffled gaps at least as big as the real one, in either direction. <code>set.seed(5)</code> makes the run repeatable.",
      h3: `treated <- d$re78[d$treat == 1]; control <- d$re78[d$treat == 0]
obs <- mean(treated) - mean(control)      # the real gap
all <- c(treated, control)

set.seed(5)
perm <- replicate(10000, {
  s <- sample(all)
  mean(s[1:185]) - mean(s[186:445])
})
mean(abs(perm) >= obs)                    # the permutation p-value

hist(perm, breaks = 50, col = "#E1EBF5", border = "white",
     main = "10,000 shuffled gaps", xlab = "Gap in mean earnings ($)")
abline(v = c(-obs, obs), col = "#E36533", lwd = 2)`,
      h3note: "With set.seed(5), 39 of the 10,000 shuffled gaps are $1,794 or more in either direction: p = 0.0039. The histogram shows the shuffled gaps centred on 0, mostly within about ±$1,300; the real gap (the orange lines) is far out in the tails. We reject H₀ of no effect at the 1% level, as with the t-test (p = 0.008).",
      code: "# Shuffle the labels 10,000 times and count the gaps at least as big as the real one\n" },

    { type: "write", title: "4(a). Without set.seed(): does anything change?",
      desc: "Run the permutation test again without <code>set.seed()</code>. Does the <i>p</i>-value change? Does your conclusion?",
      h1: "Run the code two or three times without the seed. Compare the p-values with 1% and with the t-test's p-value.",
      h2: "<ul><li>Each run uses different shuffles.</li><li>How much does p move?</li><li>Is it ever above 0.01?</li></ul>",
      h3: "<p>Without the seed the shuffles are different each time, so the p-value moves a little, typically between about 0.003 and 0.006. The conclusion does not change: only a handful of the 10,000 shuffles give a gap of $1,794 or more, so we reject H₀ of no effect at the 1% level, as with the t-test (p = 0.008).</p>" },

    { type: "r", title: "4(b). A bootstrap interval for the difference in means", plot: { width: 680, height: 400 },
      desc: "Build a bootstrap 95% interval for the difference in <i>mean</i> earnings between the groups, and compare it with the interval from <code>t.test()</code> in Problem Set 5, Question 5(b).",
      h1: "Resample each group from itself, with replacement, keeping its size (185 and 260). Record the difference in means; repeat 10,000 times; the middle 95% of the differences is the interval.",
      h2: "<code>sample(treated, replace = TRUE)</code> resamples one group; <code>quantile(boot, c(0.025, 0.975))</code> gives the 2.5th and 97.5th percentiles; <code>t.test(treated, control)$conf.int</code> gives the formula interval.",
      h3: `set.seed(6)
boot <- replicate(10000,
  mean(sample(treated, replace = TRUE)) - mean(sample(control, replace = TRUE)))
quantile(boot, c(0.025, 0.975))           # bootstrap 95% interval
t.test(treated, control)$conf.int         # the formula interval, PS5 5(b)

hist(boot, breaks = 50, col = "#FBE9E1", border = "white",
     main = "10,000 bootstrap differences in means", xlab = "Difference in mean earnings ($)")
abline(v = quantile(boot, c(0.025, 0.975)), col = "#E36533", lwd = 2)`,
      h3note: "With set.seed(6) the bootstrap 95% interval is $547 to $3,130; the t-test's interval is $474 to $3,115. The orange lines on the histogram mark the bootstrap interval.",
      code: "# Resample each group with replacement, 10,000 times\n" },

    { type: "write", title: "4(b). Compare the two intervals",
      desc: "How does the bootstrap interval compare with the t-test's? Why?",
      h1: "Put the two intervals side by side. Earnings are skewed, but what do you know about the mean of 185 or 260 observations?",
      h2: "<ul><li>The two intervals.</li><li>The central limit theorem.</li><li>Does either contain 0?</li></ul>",
      h3: "<p>The two intervals are very close: $547 to $3,130 by the bootstrap (with this seed) and $474 to $3,115 by the formula. For a difference in means with samples of 185 and 260, the central limit theorem works well even though earnings are skewed, so the formula and the bootstrap agree. Neither interval contains 0, matching the permutation test.</p>" },

    // ================================================================== Question 5 (R)
    { type: "section", eyebrow: "Questions using RStudio", title: "Question 5: Bayesian Inference in R",
      text: "<p>No data needed: these steps use the beta–binomial rule and the four beta functions, <code>dbeta()</code>, <code>pbeta()</code>, <code>qbeta()</code> and <code>rbeta()</code>.</p>" },

    { type: "r", title: "5(a). The pessimist's prior",
      desc: "The lender in the lecture saw 31 defaults in 200 loans. Use the pessimist's prior, Beta(6, 14), to find the posterior mean, the 95% credible interval and <i>P</i>(<i>p</i> &gt; 0.20). Compare them with the answers from the prior Beta(2, 18) in the lecture.",
      h1: "Add the defaults to a and the repayments (200 − 31 = 169) to b. Then summarise the posterior: its mean, its middle 95%, and the area above 0.20.",
      h2: "Mean <code>a / (a + b)</code>; credible interval <code>qbeta(c(0.025, 0.975), a, b)</code>; <code>1 - pbeta(0.20, a, b)</code> is the area above 0.20.",
      h3: `a <- 6 + 31; b <- 14 + 169                # pessimist: Beta(37, 183)
a / (a + b)                               # posterior mean
qbeta(c(0.025, 0.975), a, b)              # 95% credible interval
1 - pbeta(0.20, a, b)                     # P(p > 0.20)

a2 <- 2 + 31; b2 <- 18 + 169              # lecture: Beta(33, 187)
a2 / (a2 + b2); qbeta(c(0.025, 0.975), a2, b2); 1 - pbeta(0.20, a2, b2)`,
      h3note: "Pessimist's prior, posterior Beta(37, 183): mean 0.168, 95% credible interval 0.122 to 0.220, P(p &gt; 0.20) = 0.107. Lecture prior, posterior Beta(33, 187): mean 0.150, 0.106 to 0.200, P(p &gt; 0.20) = 0.025.",
      code: "# Posterior from the pessimist's prior Beta(6, 14) and 31 defaults in 200 loans\n" },

    { type: "write", title: "5(a). Does the prior matter here?",
      desc: "Compare the two sets of answers. Does the prior matter much after 200 loans?",
      h1: "Compare the means first, then the probability that p is above 20%.",
      h2: "<ul><li>The two priors had means of 10% and 30%.</li><li>How far apart are the posterior means?</li><li>And P(p &gt; 0.20)?</li></ul>",
      h3: "<p>The two priors had means of 10% and 30%; after 200 loans the posterior means, 0.150 and 0.168, are within two percentage points of each other, so the data have done most of the work. But the prior still matters for the board's question: the probability that p is above 20% is about 2.5% with one prior and about 11% with the other. A careful report would show both.</p>" },

    { type: "r", title: "5(b). Did training raise employment by more than 5 points?", plot: { width: 680, height: 400 },
      desc: "For the training experiment, draw 100,000 values from each posterior, Beta(141, 46) for the trainees and Beta(169, 93) for the controls. Estimate the probability that training raised employment by more than 5 percentage points, and a 95% credible interval for the difference.",
      h1: "Each pair of draws is one plausible pair of employment rates. Their difference is one plausible value of the effect, so the 100,000 differences describe the posterior of the effect.",
      h2: "<code>rbeta(1e5, 141, 46)</code> draws from a beta; <code>mean(pT - pC &gt; 0.05)</code> is the share above 5 points; <code>quantile(pT - pC, c(0.025, 0.975))</code> the credible interval.",
      h3: `set.seed(7)
pT <- rbeta(1e5, 141, 46); pC <- rbeta(1e5, 169, 93)
mean(pT - pC > 0.05)                      # P(effect > 5 points)
quantile(pT - pC, c(0.025, 0.975))        # 95% credible interval
mean(pT > pC)                             # P(training helped at all)

hist(pT - pC, breaks = 60, col = "#E4F0DE", border = "white",
     main = "100,000 plausible effects of training", xlab = "Training minus control (share employed)")
abline(v = 0.05, col = "#E36533", lwd = 2)`,
      h3note: "With set.seed(7): P(effect &gt; 5 points) = 0.914; 95% credible interval 0.023 to 0.192, so 2 to 19 percentage points; P(training helped at all) = 0.994. Each draw of pT − pC is one plausible value of the effect, so any summary of it is one line of R.",
      code: "# Draw from the two posteriors and look at the difference\n" },

    { type: "r", title: "5(c). Grid approximation with the lender's prior",
      desc: "Use the grid-approximation code from the lecture with the lender's prior, <code>prior &lt;- dbeta(p, 2, 18)</code>, and the data 3 defaults in 10 loans. Check that the posterior mean matches Beta(5, 25).",
      h1: "The grid is the three-default-rates table with 101 rows: list the possible values of p, multiply prior by likelihood on each row, and rescale so the rows add up to 1.",
      h2: "<code>p &lt;- seq(0, 1, by = 0.01)</code>; the likelihood of 3 defaults in 10 is <code>dbinom(3, 10, p)</code>; the posterior mean is <code>sum(p * post)</code>.",
      h3: `p     <- seq(0, 1, by = 0.01)             # 101 possible default rates
prior <- dbeta(p, 2, 18)                  # the lender's prior
like  <- dbinom(3, 10, p)                 # 3 defaults in 10 loans
post  <- prior * like; post <- post / sum(post)
sum(p * post)                             # posterior mean on the grid
5 / (5 + 25)                              # mean of Beta(5, 25)`,
      h3note: "Both lines print 0.1667: the grid gives the same posterior mean as Beta(5, 25), 5 ÷ 30. The grid works for any prior we can write down; the beta prior simply lets us skip it.",
      code: "# Grid approximation: prior times likelihood on 101 values of p\n" },
  ],
};
</script>
