// Problem Set 5 solutions: content only. The layout, the step-by-step reveal,
// the simulations and the R engine are in ../assets/seminar.js.
// Maths is written in TeX between \( \) or \[ \] and typeset by KaTeX.

// One random draw for each simulation.
function drawNormal(mu, sd) {     // Box–Muller: one draw from N(mu, sd^2)
  const u = 1 - Math.random(), v = Math.random();
  return mu + sd * Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
}
function drawSample(n, mu, sd) {  // a sample of n values from N(mu, sd^2): returns its mean and standard deviation
  const x = [];
  for (let i = 0; i < n; i++) x.push(drawNormal(mu, sd));
  const m = x.reduce((a, b) => a + b, 0) / n;
  const s = Math.sqrt(x.reduce((a, b) => a + (b - m) ** 2, 0) / (n - 1));
  return { m, s };
}
// Questions 2(d) and 2(e): a sample of 10 riders, hours normal with mean 40 and SD 5.3; does the interval contain 40?
function ridersCover(crit) {
  const r = drawSample(10, 40, 5.3), half = crit * r.s / Math.sqrt(10);
  return r.m - half < 40 && 40 < r.m + half;
}
// Question 3(c): a sample of 100 commutes when H0 is true (mean 40, SD 8); is the sample mean 41.8 or more?
function commuteMean() { return drawSample(100, 40, 8).m; }
// Question 4(c): a sample of 16 couriers when H0 is true (mean £460, SD £80); is t below the critical value −1.753?
function courierT() { const r = drawSample(16, 460, 80); return (r.m - 460) / (r.s / 4); }

// Small sketch of a bell curve with the area we want shaded (inline SVG), as on the Problem Set 3 and 4 pages.
// o: { mu, sd, df (optional: a t curve with df degrees of freedom), regions: [[a, b], ...] (null = minus/plus infinity),
//      ticks: [x, or { x, t: label, z: second label }], zLabels, area / areas: [{ text, at, y }], dashed: [x],
//      note: { at, y, text, anchor }, lo, hi (the range drawn), fmt, unit, title, w, h, alt }
function ncurve(o) {
  const W = o.w || 520, H = o.h || 190, L = 14, R = 14, T = o.title ? 26 : 10;
  const hasZ = (o.ticks || []).some((t) => typeof t === "object" && t.z) || o.zLabels;
  const B = hasZ ? 46 : 30;
  const mu = o.mu, sd = o.sd, lo = o.lo !== undefined ? o.lo : mu - 3.6 * sd, hi = o.hi !== undefined ? o.hi : mu + 3.6 * sd;
  const X = (x) => L + (x - lo) / (hi - lo) * (W - L - R);
  const pdf = o.df ? (x) => Math.pow(1 + ((x - mu) / sd) ** 2 / o.df, -(o.df + 1) / 2) : (x) => Math.exp(-0.5 * ((x - mu) / sd) ** 2);
  const Y = (v) => T + (1 - v) * (H - T - B);
  const base = Y(0), n = 200;
  let curve = "";
  for (let i = 0; i <= n; i++) { const x = lo + (hi - lo) * i / n; curve += (i ? "L" : "M") + X(x).toFixed(1) + " " + Y(pdf(x)).toFixed(1); }

}

        { k: "What we know", b: String.raw`<p>\(\mu_0 = 460\), \(\bar{x} = 420\), \(s = 80\), \(n = 16\).</p>` },
        { k: "Write the hypotheses", b: String.raw`\[ H_0: \mu = 460 \qquad H_1: \mu < 460 \]<p>Lower-tailed: the union suspects lower earnings.</p>` },
        { k: "Why t", b: String.raw`<span class="answer-line">The population standard deviation is unknown: we only have \(s\), from a small sample.</span>` },
      ] },

    { type: "solution", label: "4(b)", title: "Test statistic and degrees of freedom",
      question: "Find the test statistic and its degrees of freedom.",
      steps: [
        { k: "Write the formulas", b: String.raw`\[ \mathrm{SE} = \frac{s}{\sqrt{n}}, \qquad t = \frac{\bar{x} - \mu_0}{\mathrm{SE}}, \qquad \text{df} = n - 1 \]` },
        { k: "Substitute: the standard error", b: String.raw`\[ \mathrm{SE} = \frac{80}{\sqrt{16}} = \frac{80}{4} = 20 \]` },
        { k: "Substitute: the test statistic", b: String.raw`\[ t = \frac{420 - 460}{20} = \frac{-40}{20} = -2.0, \qquad \text{df} = 16 - 1 = 15 \]<span class="answer-line">Mean earnings are 2 standard errors below the platform's claim.</span>` },
      ] },

    { type: "solution", label: "4(c)", title: "One-tailed test at 5%",
      question: "Using the critical-value approach, what do you conclude at the 5% level? (A <i>t</i> table is in the Week 5 self-study slides; its 90% column gives the critical value for a one-tailed test at 5%.)",
      steps: [
        { k: "The critical value", b: String.raw`<p>Lower-tail test at 5% with 15 df. The 90% column leaves 5% in each tail, so it gives the one-tailed 5% value; the minus sign is because the test is in the lower tail.</p>\[ -t_{15,\,0.05} = -1.753, \qquad \text{reject } H_0 \text{ if } t < -1.753 \]` },
        { k: "Compare", b: String.raw`\[ t = -2.0 < -1.753 \quad\Longrightarrow\quad \text{reject } H_0 \]` +
          ncurve(Object.assign({}, T15, { regions: [[null, -1.753]], ticks: [{ x: -2, t: "" }, { x: -1.753, t: "−1.753" }, { x: 0, t: "0" }], dashed: [-2], areas: [{ text: "5%", at: -2.75, y: 135 }], notes: [{ at: -2.05, y: 30, anchor: "end", text: "t = −2.0 " }], alt: "t curve with 15 df: rejection region below −1.753; t = −2.0 lies in it" })) },
        { k: "Conclude", b: String.raw`<span class="answer-line">At the 5% level there is evidence that couriers' mean earnings are below £460.</span><p>The p-value: <code>pt(-2, 15)</code> gives \(p = 0.032\).</p>` },
      ],
      sim: { intro: "Suppose the platform is right: earnings have mean £460 and SD £80. Each draw is a sample of 16 couriers and its t statistic. Orange squares are samples with t below −1.753, which reject H₀ by mistake. The share settles on α = 5%.",
        target: 0.05, targetLabel: "α", xLabel: "Samples of 16 couriers (log scale)", yLabel: "Share with t < −1.753",
        maxDraws: 20000, tol: 0.005, yRange: [0, 0.2], yTicks: [0, 0.05, 0.1, 0.15, 0.2], legend: { hit: "Reject H₀", miss: "Do not reject" },
        draw: () => ({ hit: courierT() < -1.753 }) } },

    { type: "solution", label: "4(d)", title: "What if the test were two-tailed?",
      question: "Suppose the union had no view about the direction and had run a two-tailed test at the 5% level. What would it have concluded? What does this show?",
      steps: [
        { k: "The critical values", b: String.raw`<p>Two-tailed at 5%: 2.5% in each tail.</p>\[ \pm t_{15,\,0.025} = \pm 2.131 \]` },
        { k: "Compare", b: String.raw`\[ -2.131 < t = -2.0 < 2.131 \quad\Longrightarrow\quad \text{do not reject } H_0 \]<p>\(p = 2 \times 0.032 = 0.064 > 0.05\).</p>` +
          ncurve(Object.assign({}, T15, { regions: [[null, -2.131], [2.131, null]], ticks: [{ x: -2.131, t: "−2.131" }, { x: 0, t: "0" }, { x: 2.131, t: "2.131" }], dashed: [-2], areas: [{ text: "2.5%", at: -3, y: 135 }, { text: "2.5%", at: 3, y: 135 }], notes: [{ at: -1.95, y: 30, anchor: "start", text: " t = −2.0" }], alt: "Two-tailed: rejection regions beyond ±2.131; t = −2.0 lies just inside" })) },
        { k: "What this shows", b: "<span class='answer-line'>The same data give different verdicts depending on the alternative.</span><p>So the hypotheses must be chosen <b>before</b> seeing the data, and a result close to the 5% line should be reported with its p-value, not as a bare yes or no.</p>" },
      ] },

    // ================================================================== Question 5 (R)
    { type: "section", eyebrow: "Question using RStudio", title: "Question 5: The Training Programme by Formula",
      text: "<p>The R slides at the end of the Week 5 lecture show the code for this question. In RStudio, load the data with <code>library(causaldata); d &lt;- nsw_mixtape</code>. On this page they are already loaded as <code>d</code>, so you can skip that line. R takes a minute to start the first time; the status at the top of the page turns green when it is ready. Run the steps in order: later steps use objects created in earlier ones.</p>" },

    { type: "r", title: "5(a). Means, standard deviations and box plots", plot: { width: 680, height: 420 },
      desc: "Find the mean and standard deviation of 1978 earnings in each group, and draw a box plot of each. Start with <code>treated &lt;- d$re78[d$treat == 1]</code> and <code>control &lt;- d$re78[d$treat == 0]</code>.",
      h1: "Split 1978 earnings (<code>re78</code>) by group: <code>treat</code> is 1 for the people who got the training and 0 for the control group. Then describe each group.",
      h2: "<code>mean()</code>, <code>sd()</code>; <code>boxplot(re78 ~ treat, data = d)</code> draws one box per group. <code>summary()</code> gives the median and quartiles too.",
      h3: `treated <- d$re78[d$treat == 1]
control <- d$re78[d$treat == 0]

mean(treated); sd(treated)
mean(control); sd(control)
summary(treated); summary(control)

boxplot(re78 ~ treat, data = d, names = c("Control", "Training"), xlab = "",
        col = c("#E1EBF5", "#FBE9E1"), ylab = "1978 earnings ($)",
        main = "1978 earnings by group")`,
      h3note: "Training group: mean $6,349, SD $7,867 (185 people). Control group: mean $4,555, SD $5,484 (260 people). The medians are much lower, $4,232 and $3,139, and a quarter of the control group earned nothing at all.",
      code: "# Split the earnings by group, then describe each group\n" },

    { type: "write", title: "5(a). What do you notice?",
      desc: "What do the numbers and the box plots show about 1978 earnings in the two groups?",
      h1: "Compare each mean with its median, and each standard deviation with its mean. What do the dots above the boxes mean?",
      h2: "<ul><li>Skewness: mean far above median.</li><li>Many zeros: people with no earnings in 1978.</li><li>Outliers: a few high earners.</li><li>Training group higher on average.</li></ul>",
      h3: "<p>Both groups are strongly skewed to the right: many people earned nothing in 1978, and a few earned a lot (the dots above the boxes). The standard deviations are larger than the means, and the medians are well below the means, so most people in both groups earned far less than the mean. The training group earned more on average, by about $1,800.</p>" },

    { type: "r", title: "5(b). The two-sample t-test",
      desc: "Run <code>t.test(treated, control)</code>. Report the test statistic, the <i>p</i>-value and the 95% confidence interval.",
      h1: "The test compares the two group means. H₀: the training made no difference to mean earnings; H₁: it made a difference (two-tailed).",
      h2: "<code>t.test(x, y)</code> with the two vectors from 5(a). Read <code>t</code>, <code>p-value</code> and the <code>95 percent confidence interval</code> from the output.",
      h3: `t.test(treated, control)
mean(treated) - mean(control)     # the estimated effect`,
      h3note: "t = 2.67, p = 0.0079, and the 95% confidence interval for the difference in means is $474 to $3,115. The estimated effect is $1,794. (R uses Welch's test, which does not assume equal spreads, so df = 307.1.)",
      code: "# Two-sample t-test: training group against control group\n" },

    { type: "write", title: "5(b). State your conclusion in words",
      desc: "What do you conclude about the training programme?",
      h1: "Compare the p-value with 5% and with 1%. Does the interval contain 0?",
      h2: "<ul><li>Decision: reject or not, at which levels.</li><li>The effect in dollars.</li><li>What the interval says about how large it could be.</li></ul>",
      h3: "<p>p = 0.008, so we reject H₀ of no effect at the 5% and at the 1% level; the interval does not contain 0. The training programme raised mean 1978 earnings, by an estimated $1,794. The interval shows that the effect could be as small as about $500 or as large as about $3,100: clearly positive, but not precisely measured.</p>" },

    // ================================================================== Question 6 (optional)
    { type: "section", eyebrow: "Optional extra practice · Question 6", title: "An Interval from a Reported Standard Error",
      text: "<p>Questions 6 to 11 are optional extra practice.</p><p>A statistical office estimates annual GDP growth at 2.4%, with a standard error of 0.4 percentage points.</p>" },

    { type: "solution", label: "6(a)", title: "The 95% interval",
      question: "Build a 95% confidence interval for the true growth rate.",
      steps: [
        { k: "What we know", b: String.raw`<p>Estimate \(\hat{g} = 2.4\), \(\mathrm{SE} = 0.4\). The sample behind it is large, so the critical value comes from the normal: \(z_{0.025} = 1.96\).</p>` },
        { k: "Write the formula", b: String.raw`\[ \hat{g} \pm z \times \mathrm{SE} \]` },
        { k: "Substitute and compute", b: String.raw`\[ 2.4 \pm 1.96 \times 0.4 = 2.4 \pm 0.78 \quad\Longrightarrow\quad 1.62\% \text{ to } 3.18\% \]<span class="answer-line">We are 95% confident that true growth was between 1.62% and 3.18%.</span>` +
          ncurve(Object.assign({}, GDP, { regions: [[1.616, 3.184]], ticks: [{ x: 1.616, t: "1.62%" }, { x: 2.4, t: "2.4%" }, { x: 3.184, t: "3.18%" }], areas: [{ text: "95%", at: 2.4, y: 120 }], alt: "95% interval for growth, 1.62% to 3.18%" })) },
      ] },

    { type: "solution", label: "6(b)", title: "The 90% interval",
      question: "Build a 90% confidence interval. Why is it narrower?",
      steps: [
        { k: "The critical value", b: String.raw`\[ z_{0.05} = 1.645 \]<p>90% confidence leaves 5% in each tail.</p>` },
        { k: "Substitute and compute", b: String.raw`\[ 2.4 \pm 1.645 \times 0.4 = 2.4 \pm 0.66 \quad\Longrightarrow\quad 1.74\% \text{ to } 3.06\% \]` +
          nrow([Object.assign({}, GDP, { regions: [[1.616, 3.184]], ticks: [{ x: 1.616, t: "1.62" }, { x: 3.184, t: "3.18" }], areas: [{ text: "95%", at: 2.4, y: 100 }], title: "95%: ±1.96 SE", alt: "95% interval" }),
                Object.assign({}, GDP, { regions: [[1.742, 3.058]], ticks: [{ x: 1.742, t: "1.74" }, { x: 3.058, t: "3.06" }], areas: [{ text: "90%", at: 2.4, y: 100 }], title: "90%: ±1.645 SE", alt: "90% interval" })], ["vs"]) },
        { k: "Why narrower", b: "<span class='answer-line'>We ask for less confidence, so we go out fewer standard errors.</span><p>The price of a narrower interval is that it misses the true value more often: 10% of the time instead of 5%.</p>" },
      ] },

    { type: "solution", label: "6(c)", title: "The minister and the critic",
      question: "A minister says that growth was 3%. A critic says that the economy did not grow at all. Is each claim consistent with the data at the 95% level?",
      steps: [
        { k: "The criterion", b: "<p>A value is consistent with the data at the 95% level if it lies inside the 95% interval, 1.62% to 3.18%.</p>" },
        { k: "The minister: 3%", b: "<span class='answer-line'>Inside the interval: consistent with the data.</span>" },
        { k: "The critic: 0%", b: String.raw`<span class="answer-line">Far outside the interval: not consistent with the data.</span><p>Equivalently, a two-tailed test of \(H_0\): growth = 0 at 5% rejects: \(z = 2.4 / 0.4 = 6\).</p>` +
          ncurve(Object.assign({}, GDP, { lo: -0.3, hi: 4.2, regions: [[1.616, 3.184]], ticks: [{ x: 0, t: "0%" }, { x: 1.616, t: "1.62%" }, { x: 3.184, t: "3.18%" }], dashed: [0, 3], notes: [{ at: 0.08, y: 40, anchor: "start", text: "critic" }, { at: 3.06, y: 40, anchor: "start", text: "minister" }], alt: "The 95% interval contains 3% but not 0%" })) },
      ] },

    // ================================================================== Question 7 (optional)
    { type: "section", eyebrow: "Optional extra practice · Question 7", title: "Two Groups",
      text: "<p>In a randomised trial of a microfinance programme, 200 households were offered loans and 250 were not. A year later, monthly household income was:</p><table class='ptab'><tr><th></th><th>Households</th><th>Mean income</th><th>Standard deviation</th></tr><tr><th>Offered loans</th><td>200</td><td>$310</td><td>$120</td></tr><tr><th>Not offered loans</th><td>250</td><td>$290</td><td>$110</td></tr></table>" },

    { type: "solution", label: "7(a)", title: "The hypotheses",
      question: "State the hypotheses for a two-tailed test of whether the programme changed mean income.",
      steps: [
        { k: "Define the groups", b: String.raw`<p>Group 1: offered loans, \(n_1 = 200\), \(\bar{x}_1 = 310\), \(s_1 = 120\). Group 2: not offered, \(n_2 = 250\), \(\bar{x}_2 = 290\), \(s_2 = 110\).</p>` },
        { k: "Write the hypotheses", b: String.raw`\[ H_0: \mu_1 - \mu_2 = 0 \qquad H_1: \mu_1 - \mu_2 \neq 0 \]<span class="answer-line">H₀: the programme made no difference to mean income.</span>` },
      ] },

    { type: "solution", label: "7(b)", title: "Standard error of the difference",
      question: "Find the standard error of the difference in means.",
      steps: [
        { k: "Write the formula", b: String.raw`\[ \mathrm{SE}(\bar{x}_1 - \bar{x}_2) = \sqrt{\frac{s_1^2}{n_1} + \frac{s_2^2}{n_2}} \]<p>The variances of two independent means add.</p>` },
        { k: "Substitute", b: String.raw`\[ \sqrt{\frac{120^2}{200} + \frac{110^2}{250}} = \sqrt{\frac{14{,}400}{200} + \frac{12{,}100}{250}} = \sqrt{72 + 48.4} \]` },
        { k: "Compute", b: String.raw`\[ \sqrt{120.4} = 10.97 \]<span class="answer-line">The difference in sample means typically misses the true effect by about $11.</span>` },
      ] },

    { type: "solution", label: "7(c)", title: "Test statistic and p-value",
      question: "Find the test statistic. The samples are large, so use the normal table to find the <i>p</i>-value.",
      steps: [
        { k: "Write the formula", b: String.raw`\[ z = \frac{(\bar{x}_1 - \bar{x}_2) - 0}{\mathrm{SE}}, \qquad p = 2 \times P(Z \ge |z|) \]` },
        { k: "Substitute: the test statistic", b: String.raw`\[ z = \frac{310 - 290}{10.97} = \frac{20}{10.97} = 1.82 \]` },
        { k: "Compute the p-value", b: String.raw`<p>Two-tailed, so both tails count:</p>\[ p = 2 \times (1 - 0.9656) = 2 \times 0.0344 = 0.069 \]` +
          ncurve(Object.assign({}, Z, { regions: [[null, -1.82], [1.82, null]], ticks: [{ x: -1.82, t: "−1.82" }, { x: 0, t: "0" }, { x: 1.82, t: "1.82" }], areas: [{ text: "0.034", at: -2.6, y: 128 }, { text: "0.034", at: 2.6, y: 128 }], alt: "Two-tailed p-value: 0.034 in each tail beyond ±1.82, total 0.069" })) },
      ] },

    { type: "solution", label: "7(d)", title: "At 5% and at 10%",
      question: "What do you conclude at the 5% level? At the 10% level?",
      steps: [
        { k: "At 5%", b: String.raw`\[ p = 0.069 > 0.05 \quad\Longrightarrow\quad \text{do not reject } H_0 \]<p>The difference is not statistically significant at 5%.</p>` },
        { k: "At 10%", b: String.raw`\[ p = 0.069 < 0.10 \quad\Longrightarrow\quad \text{reject } H_0 \]<span class="answer-line">Weak evidence of an effect: significant at 10%, not at 5%.</span>` },
      ] },

    { type: "solution", label: "7(e)", title: "A 95% interval for the effect",
      question: "Build a 95% confidence interval for the effect of the programme. How does it agree with your answer to (d)?",
      steps: [
        { k: "Write the formula", b: String.raw`\[ (\bar{x}_1 - \bar{x}_2) \pm 1.96 \times \mathrm{SE} \]` },
        { k: "Substitute and compute", b: String.raw`\[ 20 \pm 1.96 \times 10.97 = 20 \pm 21.5 \quad\Longrightarrow\quad -\$1.5 \text{ to } \$41.5 \text{ a month} \]` +
          ncurve(Object.assign({}, DIF, { regions: [[-1.5, 41.5]], ticks: [{ x: -1.5, t: "−$1.5" }, { x: 20, t: "$20" }, { x: 41.5, t: "$41.5" }], dashed: [0], areas: [{ text: "95%", at: 20, y: 120 }], notes: [{ at: -2.5, y: 30, anchor: "end", text: "0 = no effect " }], alt: "95% interval for the effect, −$1.5 to $41.5, just containing 0" })) },
        { k: "Agreement with (d)", b: "<span class='answer-line'>The interval contains 0, which matches not rejecting H₀ at 5%.</span><p>A two-tailed test at 5% rejects exactly when the value claimed by H₀ lies outside the 95% interval.</p>" },
      ] },

    { type: "solution", label: "7(f)", title: "Large? And does it work?",
      question: "Is the estimated effect large in economic terms? Is “no significant effect at 5%” the same as “the programme does not work”?",
      steps: [
        { k: "Economic size", b: String.raw`\[ \frac{20}{290} = 6.9\% \]<p>About 7% of the control group's income, which could matter a lot to poor households.</p>` },
        { k: "Not significant ≠ no effect", b: "<p>The interval runs from about zero to a gain of $41 (14%), so the data are consistent with a worthwhile effect as well as with no effect.</p>" },
        { k: "Conclude", b: "<span class='answer-line'>No: “not significant” means “not shown”, not “shown to be absent”. A larger trial would be needed to tell.</span>" },
      ] },

    // ================================================================== Question 8 (optional, R)
    { type: "section", eyebrow: "Optional extra practice · Question 8", title: "Checking Question 2 in R",
      text: "<p>Run the steps in order.</p>" },

    { type: "r", title: "8(a). Enter the data and check 2(a) and 2(b)",
      desc: "Enter the data: <code>hours &lt;- c(32, 40, 38, 45, 36, 41, 39, 50, 35, 44)</code>. Check your answers to 2(a) and 2(b) with <code>mean()</code>, <code>sd()</code> and <code>sd(hours) / sqrt(10)</code>.",
      h1: "Store the ten numbers in a vector, then apply each function to it.",
      h2: "<code>c()</code> combines values into a vector; <code>&lt;-</code> stores it as <code>hours</code>. Then <code>mean(hours)</code>, <code>sd(hours)</code>.",
      h3: `hours <- c(32, 40, 38, 45, 36, 41, 39, 50, 35, 44)
mean(hours)                       # 2(a)
sd(hours)                         # 2(a)
sd(hours) / sqrt(10)              # 2(b) the standard error`,
      h3note: "R prints 40, 5.2915 and 1.6733: the same as 2(a) and 2(b).",
      code: "# Enter the hours and check 2(a) and 2(b)\n" },

    { type: "r", title: "8(b). The critical value",
      desc: "Find the critical value with <code>qt(0.975, df = 9)</code>.",
      h1: "For 95% confidence we want the t value with 97.5% of the area to its left (2.5% in the upper tail).",
      h2: "<code>qt()</code> is the t version of <code>qnorm()</code>. Compare with <code>qnorm(0.975)</code>.",
      h3: `qt(0.975, df = 9)                 # t critical value, 9 df
qnorm(0.975)                      # the z value, for comparison`,
      h3note: "2.2622 against 1.96: the same as the t table in 2(c).",
      code: "# The t critical value for a 95% interval with 9 df\n" },

    { type: "r", title: "8(c). The interval with t.test()",
      desc: "Run <code>t.test(hours)</code>. Does the interval match your answer to 2(d)? Then run <code>t.test(hours, conf.level = 0.99)</code>.",
      h1: "<code>t.test()</code> builds the t interval in one line. Look for the line \"95 percent confidence interval\".",
      h2: "Change the confidence level with <code>conf.level = 0.99</code>; <code>$conf.int</code> prints only the interval.",
      h3: `t.test(hours)                               # 95% interval
t.test(hours, conf.level = 0.99)$conf.int   # 99% interval
qt(0.995, df = 9)                           # its critical value`,
      h3note: "The 95% interval is 36.21 to 43.79 hours, as in 2(d). The 99% interval is 34.56 to 45.44, with t = 3.250. (The t = 23.9 and tiny p-value at the top of the output test whether mean hours are 0, which is not a question we care about here.)",
      code: "# 95% and 99% intervals with t.test()\n" },

    { type: "write", title: "8(c). Why is the 99% interval wider?",
      desc: "Explain in one or two sentences why the 99% interval is wider than the 95% interval.",
      h1: "Which part of estimate ± critical value × SE changed?",
      h2: "<ul><li>Same estimate, same standard error.</li><li>A larger critical value: 3.250 instead of 2.262.</li></ul>",
      h3: "<p>The estimate (40) and the standard error (1.67) are the same; only the critical value changes, from 2.262 to 3.250. To capture the true mean in 99% of samples instead of 95%, the interval must go further out, so it is wider: more confidence costs precision.</p>" },

    // ================================================================== Question 9 (optional, R)
    { type: "section", eyebrow: "Optional extra practice · Question 9", title: "How Often Does the Method Work?",
      text: "<p>Use the wage population from Week 3: <code>library(ISLR); wage &lt;- Wage$wage; mu &lt;- mean(wage)</code>. On this page <code>wage</code> is already loaded, so start with <code>mu &lt;- mean(wage)</code>. Run the steps in order.</p>" },

    { type: "r", title: "9(a). One sample, one interval",
      desc: "Draw one sample of 30 workers and find its 90% confidence interval with <code>t.test(sample(wage, 30), conf.level = 0.90)$conf.int</code>. Does it contain <code>mu</code>?",
      h1: "The 3,000 wages are the population, so we know the true mean μ. One sample of 30 gives one interval: check whether μ is inside it.",
      h2: "<code>mu &lt;- mean(wage)</code>. Store the interval as <code>ci</code>; then <code>ci[1] &lt; mu &amp; mu &lt; ci[2]</code> is TRUE when it contains μ. <code>set.seed(2026)</code> makes the result repeatable.",
      h3: `mu <- mean(wage)                  # the true mean: 111.7
set.seed(2026)
ci <- t.test(sample(wage, 30), conf.level = 0.90)$conf.int
ci
ci[1] < mu & mu < ci[2]           # does it contain mu?`,
      h3note: "μ = 111.70. With this seed the interval is 95.73 to 123.75, which contains μ: TRUE. With another seed you get a different interval; about one in ten would give FALSE.",
      code: "# One sample of 30 workers: does its 90% interval contain mu?\n" },

    { type: "r", title: "9(b). Repeat 1,000 times",
      desc: "Repeat 1,000 times and record how often the interval contains <code>mu</code> (adapt the code on the slide “Does a 95% Interval Really Work 95% of the Time?”). What share do you expect? What share do you get?",
      h1: "Put the whole of 9(a) inside <code>replicate()</code>, so that each repetition draws a new sample and returns TRUE or FALSE. The mean of 1,000 TRUEs and FALSEs is the share of hits.",
      h2: "<code>hit &lt;- replicate(1000, { ... })</code>, with the interval and the check inside the braces; then <code>mean(hit)</code>.",
      h3: `set.seed(2026)
hit <- replicate(1000, {
  ci <- t.test(sample(wage, 30), conf.level = 0.90)$conf.int
  ci[1] < mu & mu < ci[2]
})
mean(hit)                         # share of intervals that contain mu`,
      h3note: "We expect 0.90. With this seed, 879 of the 1,000 intervals contain μ: a share of 0.879. Without the seed, typical results are between 0.86 and 0.90.",
      code: "# Repeat 9(a) 1,000 times and record how often the interval contains mu\n" },

    { type: "write", title: "9(c). Why not exactly 0.90?",
      desc: "Why is your answer to (b) not exactly the share you expected?",
      h1: "Run 9(b) again without the seed. Does the share change? Is it as often above 0.90 as below?",
      h2: "<ul><li>Simulation noise: 1,000 repetitions are themselves a random sample.</li><li>The t-interval is exact only for a normal population.</li><li>Are wages normal?</li></ul>",
      h3: "<p>Two reasons. First, the 1,000 repetitions are themselves a random sample of intervals, so the share varies from run to run, by about ±0.01 to 0.02. Second, the t-interval is exact only when the population is normal. Wages are skewed to the right, so with n = 30 the long-run coverage is slightly below the promised 90%: averaging many runs gives about 0.88.</p>" },

    { type: "r", title: "Extension: see the intervals", plot: { width: 680, height: 520 },
      desc: "Draw 50 of the 90% intervals as horizontal lines, with a vertical line at μ, and colour the misses.",
      h1: "Store the two ends of each interval, then draw one segment per sample.",
      h2: "<code>replicate()</code> returning both ends gives a 2 × 50 matrix; <code>segments()</code> draws the lines and <code>abline(v = mu)</code> the true mean.",
      h3: `set.seed(1)
ends <- replicate(50, t.test(sample(wage, 30), conf.level = 0.90)$conf.int)
miss <- ends[1, ] > mu | ends[2, ] < mu
plot(NA, xlim = range(ends), ylim = c(1, 50), xlab = "Wage ($ thousands)", ylab = "Sample",
     main = "50 intervals at 90%: misses in orange")
segments(ends[1, ], 1:50, ends[2, ], 1:50, lwd = 2, col = ifelse(miss, "#E36533", "#2A5A88"))
abline(v = mu, lty = 2)
sum(miss)                         # how many of the 50 miss mu?`,
      h3note: "With this seed 5 of the 50 intervals miss μ (samples 6, 13, 26, 31 and 45): one in ten, as promised. All five miss on the low side: wages are skewed to the right, the point of 9(c). Each run gives a different picture; the share of misses hovers around 10%.",
      code: "# Draw 50 of the intervals\n" },

    // ================================================================== Question 10 (optional)
    { type: "section", eyebrow: "Optional extra practice · Question 10", title: "An Interval for a Proportion",
      text: "<p>In a random sample of 600 small firms, 150 say that they find it difficult to get a bank loan. (See the self-study slide “A Confidence Interval for a Proportion”.)</p>" },

    { type: "solution", label: "10(a)", title: "The estimate",
      question: "Estimate the proportion of all small firms that find it difficult to get a loan.",
      steps: [
        { k: "Write the formula", b: String.raw`\[ \hat{p} = \frac{x}{n} \]<p>\(x\) = firms that find it difficult, \(n\) = firms in the sample.</p>` },
        { k: "Substitute and compute", b: String.raw`\[ \hat{p} = \frac{150}{600} = 0.25 \]<span class="answer-line">We estimate that 25% of small firms find it difficult to get a loan.</span>` },
      ] },

    { type: "solution", label: "10(b)", title: "The standard error",
      question: "Find the standard error of your estimate.",
      steps: [
        { k: "Write the formula", b: String.raw`\[ \mathrm{SE}(\hat{p}) = \sqrt{\frac{\hat{p}(1 - \hat{p})}{n}} \]` },
        { k: "Substitute and compute", b: String.raw`\[ \sqrt{\frac{0.25 \times 0.75}{600}} = \sqrt{0.0003125} = 0.0177 \]<span class="answer-line">The survey's estimate is typically about 1.8 percentage points from the truth.</span>` },
      ] },

    { type: "solution", label: "10(c)", title: "The 95% interval",
      question: "Build a 95% confidence interval for the proportion, and interpret it.",
      steps: [
        { k: "Check the conditions", b: "<p>150 successes and 450 failures, both at least 10: the normal approximation is fine, so we use z = 1.96.</p>" },
        { k: "Write the formula", b: String.raw`\[ \hat{p} \pm z \times \mathrm{SE}(\hat{p}) \]` },
        { k: "Substitute and compute", b: String.raw`\[ 0.25 \pm 1.96 \times 0.0177 = 0.25 \pm 0.035 \quad\Longrightarrow\quad 21.5\% \text{ to } 28.5\% \]<span class="answer-line">We are 95% confident that between 21.5% and 28.5% of all small firms find it difficult to get a loan.</span>` +
          ncurve(Object.assign({}, FIRM, { regions: [[0.2154, 0.2846]], ticks: [0.2154, 0.25, 0.2846], areas: [{ text: "95%", at: 0.25, y: 120 }], alt: "95% interval for the proportion, 21.5% to 28.5%" })) },
      ] },

    { type: "solution", label: "10(d)", title: "“A third of small firms”",
      question: "A business lobby claims that “a third of small firms” struggle to get loans. Is the claim consistent with the survey?",
      steps: [
        { k: "Compare with the interval", b: String.raw`<p>One third is 33.3%; the interval is 21.5% to 28.5%.</p>` +
          ncurve(Object.assign({}, FIRM, { hi: 0.35, regions: [[0.2154, 0.2846]], ticks: [0.2154, 0.2846, { x: 1 / 3, t: "33.3%" }], dashed: [1 / 3], notes: [{ at: 1 / 3, y: 30, anchor: "end", text: "the claim " }], alt: "One third lies well above the 95% interval" })) },
        { k: "Conclude", b: String.raw`<span class="answer-line">No: one third lies well above the top of the interval, so the survey is evidence against the claim.</span><p>As a test: \(z = (0.25 - 0.333) / 0.0192 = -4.3\), using the standard error under \(H_0: p = 1/3\).</p>` },
      ] },

    // ================================================================== Question 11 (optional)
    { type: "section", eyebrow: "Optional extra practice · Question 11", title: "Sample Size",
      text: "<p>See the self-study slide “How Big a Sample Do I Need?”. The margin of error is E = critical value × SE; solve it for n.</p>" },

    { type: "solution", label: "11(a)", title: "Riders' hours to within ±1 hour",
      question: "The researcher in Question 2 wants to estimate riders' mean weekly hours to within ±1 hour, with 95% confidence. Using σ ≈ 5.3 from the pilot sample, how many riders are needed?",
      steps: [
        { k: "Write the formula", b: String.raw`\[ E = z \times \frac{\sigma}{\sqrt{n}} \quad\Longrightarrow\quad n = \left( \frac{z\,\sigma}{E} \right)^{2} \]` },
        { k: "Substitute and compute", b: String.raw`\[ n = \left( \frac{1.96 \times 5.3}{1} \right)^{2} = 10.39^2 = 107.9 \]` },
        { k: "Round up", b: "<span class='answer-line'>108 riders.</span><p>Always round up: 107 would give a margin slightly above 1 hour.</p>" },
      ] },

    { type: "solution", label: "11(b)", title: "A proportion to within ±3 points",
      question: "A survey must estimate a proportion to within ±3 percentage points, with 95% confidence. How many respondents are needed? (Use <i>p</i> = 0.5.)",
      steps: [
        { k: "Write the formula", b: String.raw`\[ E = z \sqrt{\frac{p(1 - p)}{n}} \quad\Longrightarrow\quad n = \frac{p(1 - p)\,z^2}{E^2} \]<p>With \(p = 0.5\), \(p(1 - p) = 0.25\), the largest possible value, so the answer is safe whatever the true \(p\).</p>` },
        { k: "Substitute and compute", b: String.raw`\[ n = 0.25 \times \left( \frac{1.96}{0.03} \right)^{2} = 0.25 \times 65.33^2 = 1{,}067.1 \]<span class="answer-line">1,068 respondents.</span>` },
      ] },

    { type: "solution", label: "11(c)", title: "Halving the margin of error",
      question: "How many respondents would be needed to halve the margin of error in (b)? What general rule does this show?",
      steps: [
        { k: "Substitute E = 0.015", b: String.raw`\[ n = 0.25 \times \left( \frac{1.96}{0.015} \right)^{2} = 4{,}268.4 \quad\Longrightarrow\quad 4{,}269 \]<span class="answer-line">4,269 respondents: four times as many.</span>` },
        { k: "The general rule", b: String.raw`<p>\(n\) enters the margin of error through \(\sqrt{n}\):</p>\[ \frac{E}{2} \quad\Longleftrightarrow\quad 4n \]<span class="answer-line">Halving the margin of error needs four times the sample.</span>` },
      ] },
  ],
};
